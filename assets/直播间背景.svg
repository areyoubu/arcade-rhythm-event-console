<svg width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181a1f"/>
      <stop offset="0.55" stop-color="#111216"/>
      <stop offset="1" stop-color="#0b0c0e"/>
    </linearGradient>

    <radialGradient id="glowL" cx="0" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#d0344e" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#d0344e" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#d0344e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="1" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#3d78c9" stop-opacity="0.16"/>
      <stop offset="0.45" stop-color="#3d78c9" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#3d78c9" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="0.5" cy="0.48" r="0.75">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <pattern id="gridBig" width="192" height="192" patternUnits="userSpaceOnUse">
      <path d="M 192 0 L 0 0 0 192" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>

    <linearGradient id="topFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08090b" stop-opacity="0.72"/>
      <stop offset="0.78" stop-color="#08090b" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#08090b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 底 -->
  <rect width="1920" height="1080" fill="url(#bg)"/>

  <!-- 左右两侧的队伍色氛围光 -->
  <rect width="960" height="1080" fill="url(#glowL)"/>
  <rect x="960" width="960" height="1080" fill="url(#glowR)"/>

  <!-- 技术网格 -->
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#gridBig)"/>

  <!-- 顶部给比分叠加的压暗带 -->
  <rect width="1920" height="300" fill="url(#topFade)"/>
  <line x1="0" y1="288" x2="960" y2="288" stroke="#d0344e" stroke-width="1" stroke-opacity="0.32"/>
  <line x1="960" y1="288" x2="1920" y2="288" stroke="#3d78c9" stroke-width="1" stroke-opacity="0.32"/>

  <!-- 边缘色条（与模板的 1P/2P 侧条呼应） -->
  <rect x="0" y="0" width="4" height="1080" fill="#d0344e" opacity="0.5"/>
  <rect x="1916" y="0" width="4" height="1080" fill="#3d78c9" opacity="0.5"/>

  <!-- 暗角 -->
  <rect width="1920" height="1080" fill="url(#vignette)"/>

  <!-- 角落刻度 -->
  <g stroke="#33363c" stroke-width="1.5" fill="none">
    <path d="M 22 40 V 22 H 40"/>
    <path d="M 1880 22 H 1898 V 40"/>
    <path d="M 22 1040 V 1058 H 40"/>
    <path d="M 1880 1058 H 1898 V 1040"/>
  </g>

  <!-- 顶部标识 -->
  <rect x="40" y="28" width="7" height="7" fill="#d0344e"/>
  <text x="56" y="36" font-family="'Consolas','Cascadia Mono',monospace" font-size="13" letter-spacing="3" fill="#4a4e56">CHUNITHM · LIVE ROOM</text>
  <text x="1880" y="36" font-family="'Consolas','Cascadia Mono',monospace" font-size="13" letter-spacing="2" fill="#4a4e56" text-anchor="end">STAGE 01 · 1920 × 1080</text>

  <!-- 底部标识 -->
  <text x="40" y="1054" font-family="'Consolas','Cascadia Mono',monospace" font-size="11" letter-spacing="2" fill="#33363c">LIVE BROADCAST LAYOUT</text>
  <text x="1880" y="1054" font-family="'Consolas','Cascadia Mono',monospace" font-size="11" letter-spacing="2" fill="#33363c" text-anchor="end">OBS BROWSER · NDI / HDMI</text>

</svg>