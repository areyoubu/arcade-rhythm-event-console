<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全屏随机选曲 · 街机音游赛事控制软件</title>
<!--
  全屏随机选曲场景 —— OBS 整屏场景 / 独立窗口。

  · 曲目条从右向左滑动，缓停后放大选中曲目的曲绘与信息；
  · 背景默认复用直播间动态背景，?static=1 使用静态 PNG；
  · 由 /random 控制台通过 POST /api/random/spin 触发，结果走 WS random.state。
-->
<style>
  :root {
    --accent: #d9a441;
    --ink: #ffffff;
    --ink-dim: #c7ccd6;
    --ink-mute: #8c93a0;
    --panel: rgba(10, 11, 14, .86);
    --line: rgba(255, 255, 255, .14);
    --mono: ui-monospace, 'Cascadia Code', Consolas, monospace;
    --card-w: 240px;
    --card-gap: 18px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #0a0b0d;
    color: var(--ink);
    overflow: hidden;
    font-family: 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    position: fixed; left: 0; top: 0;
    width: 1920px; height: 1080px;
    transform-origin: top left;
    overflow: hidden;
    background: #0a0b0d;
  }

  /* ── 背景：动态视频 / 静态 PNG 兜底 ── */
  .bg {
    position: absolute; inset: 0; z-index: 0;
    background: #0a0b0d url('/assets/liveroom-background.png') center / cover no-repeat;
  }
  .bg-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .bg-video[hidden] { display: none; }
  .bg-shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(5, 6, 8, .76) 0%, rgba(5, 6, 8, .24) 28%, rgba(5, 6, 8, .18) 60%, rgba(5, 6, 8, .78) 100%),
      radial-gradient(120% 90% at 50% 48%, rgba(0, 0, 0, 0) 24%, rgba(0, 0, 0, .50) 100%);
  }

  .scene { position: absolute; inset: 0; z-index: 2; }

  /* ── 顶部 ── */
  .head {
    position: absolute; left: 72px; right: 72px; top: 44px;
    display: flex; align-items: center; gap: 18px;
  }
  .head .dot { width: 10px; height: 10px; background: var(--accent); flex: 0 0 auto; }
  .brand {
    font-family: var(--mono); font-size: 13px; font-weight: 700;
    letter-spacing: 2.6px; color: #aeb4c0; white-space: nowrap;
  }
  .head .title {
    padding-left: 16px; border-left: 3px solid var(--accent);
    font-size: 28px; font-weight: 900; letter-spacing: .5px;
  }
  .head .spacer { flex: 1; }
  .phase {
    font-family: var(--mono); font-size: 12px; font-weight: 800; letter-spacing: 2px;
    padding: 6px 12px; border: 1px solid var(--line); color: var(--ink-dim);
    background: rgba(8, 9, 12, .62);
  }
  .phase.live { color: var(--accent); border-color: var(--accent-border); }

  /* ── 滚动曲目条 ── */
  .reel-wrap {
    position: absolute; left: 0; right: 0; top: 330px; height: 390px;
    transition: filter .65s ease, transform .65s ease, opacity .65s ease;
  }
  .reel-viewport {
    position: absolute; inset: 0; overflow: hidden;
  }
  /* 用两层渐变遮边代替 mask-image：mask 会让 CEF 把整条滚动层
     再做一次离屏合成，OBS 里容易出现「曲目到了、曲绘还没画出来」。 */
  .reel-viewport::before, .reel-viewport::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 8%; z-index: 3;
    pointer-events: none;
  }
  .reel-viewport::before {
    left: 0; background: linear-gradient(90deg, rgba(8, 9, 12, .96), rgba(8, 9, 12, 0));
  }
  .reel-viewport::after {
    right: 0; background: linear-gradient(270deg, rgba(8, 9, 12, .96), rgba(8, 9, 12, 0));
  }
  .reel-strip {
    display: flex; align-items: center; gap: var(--card-gap);
    height: 100%;
    transform: translateX(0);
    transition: none;
  }
  .reel-card {
    width: var(--card-w); flex: 0 0 var(--card-w); height: 350px;
    display: flex; flex-direction: column; gap: 9px;
    padding: 14px 14px 12px;
    background: rgba(10, 11, 14, .84);
    border: 1px solid rgba(255, 255, 255, .14);
    box-shadow: 0 18px 42px rgba(0, 0, 0, .30);
    position: relative;
    overflow: hidden;
  }
  .reel-card .cover {
    width: 100%; aspect-ratio: 1 / 1; object-fit: cover;
    background: #111; border: 1px solid rgba(255, 255, 255, .12);
  }
  .reel-card .cover.ph {
    display: flex; align-items: center; justify-content: center;
    color: #5f636b; font-size: 44px;
  }
  .reel-card .t {
    font-size: 17px; font-weight: 800; line-height: 1.25;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .reel-card .a {
    font-size: 12px; color: var(--ink-mute);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .reel-card .m { display: flex; align-items: center; gap: 6px; margin-top: auto; }
  .diff-chip {
    font-family: var(--mono); font-size: 10.5px; font-weight: 800; letter-spacing: .4px;
    padding: 2px 7px; color: #fff; white-space: nowrap;
  }
  .reel-card.target { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(var(--accent-rgb),.32), 0 22px 54px rgba(0,0,0,.45); }
  .stage.done .reel-wrap {
    filter: blur(12px) brightness(.32);
    transform: scale(.97);
    opacity: .85;
  }
  .stage.done .head { opacity: .35; transition: opacity .5s ease; }

  /* 中心指针 / 高亮 */
  .pointer {
    position: absolute; left: 50%; top: 300px; bottom: 300px;
    width: 2px; transform: translateX(-50%);
    background: linear-gradient(180deg, transparent, var(--accent) 18%, var(--accent) 82%, transparent);
    box-shadow: 0 0 24px rgba(var(--accent-rgb), .55);
    z-index: 4; opacity: 0;
    transition: opacity .35s ease;
  }
  .pointer::before, .pointer::after {
    content: ''; position: absolute; left: 50%; transform: translateX(-50%);
    border-left: 9px solid transparent; border-right: 9px solid transparent;
  }
  .pointer::before { top: -14px; border-top: 14px solid var(--accent); }
  .pointer::after { bottom: -14px; border-bottom: 14px solid var(--accent); }
  .stage.spinning .pointer { opacity: 1; }
  .stage.done .pointer { opacity: 0; }
  .pointer-glow {
    position: absolute; left: 50%; top: 300px; height: 480px; width: 280px;
    transform: translate(-50%, 0);
    background: radial-gradient(ellipse at center, rgba(var(--accent-rgb), .16), transparent 68%);
    z-index: 1; opacity: 0; transition: opacity .4s ease;
  }
  .stage.spinning .pointer-glow { opacity: 1; }

  /* ── 空闲提示 ── */
  .idle {
    position: absolute; inset: 0; z-index: 3;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 18px; text-align: center;
    transition: opacity .35s ease;
  }
  .idle .ring {
    width: 54px; height: 54px; border: 2px solid rgba(var(--accent-rgb), .45);
    border-top-color: var(--accent); border-radius: 50%;
    animation: idle-spin 2.4s linear infinite;
  }
  @keyframes idle-spin { to { transform: rotate(360deg); } }
  .idle .t { font-size: 26px; font-weight: 800; color: var(--ink-dim); letter-spacing: 2px; }
  .idle .s { font-family: var(--mono); font-size: 12px; letter-spacing: 2px; color: var(--ink-mute); }
  .stage.spinning .idle, .stage.done .idle { opacity: 0; pointer-events: none; }

  /* ── 结果卡 ── */
  .result {
    position: absolute; inset: 0; z-index: 6;
    display: flex; align-items: center; justify-content: center;
    padding: 80px 110px;
    opacity: 0; pointer-events: none;
  }
  .result.show { opacity: 1; }
  .result-card {
    position: relative;
    width: min(1280px, 88%);
    display: flex; align-items: center; gap: 54px;
    padding: 46px 54px;
    background: linear-gradient(135deg, rgba(12, 13, 17, .96), rgba(12, 13, 17, .86));
    border: 1px solid rgba(var(--accent-rgb), .35);
    border-left: 5px solid var(--accent);
    box-shadow: 0 34px 90px rgba(0, 0, 0, .55);
    transform: scale(.92) translateY(20px);
    opacity: 0;
    transition: transform .8s cubic-bezier(.16, 1, .3, 1), opacity .55s ease;
  }
  .result.show .result-card { transform: scale(1) translateY(0); opacity: 1; }
  .result-card::before {
    content: ''; position: absolute; inset: -1px;
    background: radial-gradient(60% 100% at 14% 50%, rgba(var(--accent-rgb),.10), transparent 70%);
    pointer-events: none;
  }
  .result-cover {
    flex: 0 0 auto; width: 430px; height: 430px;
    border: 1px solid rgba(255, 255, 255, .18);
    background: #111; box-shadow: 0 22px 56px rgba(0, 0, 0, .55);
    transform: scale(1.08); opacity: 0;
    transition: transform .9s cubic-bezier(.16, 1, .3, 1) .10s, opacity .6s ease .10s;
    overflow: hidden;
  }
  .result.show .result-cover { transform: scale(1); opacity: 1; }
  .result-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .result-cover .ph {
    width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
    color: #5f636b; font-size: 80px;
  }
  .result-info { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 14px; }
  .kicker {
    font-family: var(--mono); font-size: 12px; font-weight: 800;
    letter-spacing: 3px; color: var(--accent);
  }
  .result-title {
    font-size: 62px; font-weight: 900; line-height: 1.1; letter-spacing: .5px;
    word-break: break-word; text-shadow: 0 4px 22px rgba(0, 0, 0, .45);
    opacity: 0; transform: translateY(14px);
    transition: opacity .55s ease .20s, transform .7s cubic-bezier(.16,1,.3,1) .20s;
  }
  .result-artist {
    font-size: 26px; font-weight: 600; color: var(--ink-dim);
    opacity: 0; transform: translateY(12px);
    transition: opacity .55s ease .28s, transform .7s cubic-bezier(.16,1,.3,1) .28s;
  }
  .result.show .result-title, .result.show .result-artist { opacity: 1; transform: none; }
  .meta-line { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .tag {
    font-size: 12.5px; font-weight: 700; padding: 4px 9px;
    border: 1px solid var(--line); color: var(--ink-dim); background: rgba(255,255,255,.03);
  }
  .tag.cn { color: #8fc7a2; border-color: #345641; }
  .tag.we { color: #c98bff; border-color: #5b3a78; }
  /* 抽中的难度：按官方难度色填充的胶囊（颜色由 JS 写入） */
  .result-level {
    display: inline-flex; align-items: center;
    font-family: var(--mono); font-size: 19px; font-weight: 800;
    letter-spacing: 1px; padding: 9px 18px; border-radius: 3px;
    color: #fff; white-space: nowrap;
  }
  .result-note {
    font-size: 13px; color: var(--ink-mute); line-height: 1.6;
    opacity: 0; transition: opacity .55s ease .42s;
  }
  .result.show .result-note { opacity: 1; }

  /* 结果外发光 */
  .glow {
    position: absolute; width: 900px; height: 600px; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    background: radial-gradient(ellipse at center, rgba(var(--accent-rgb),.14), transparent 65%);
    opacity: 0; transition: opacity .8s ease;
    pointer-events: none;
  }
  .result.show .glow { opacity: 1; animation: glow-pulse 3.6s ease-in-out infinite; }
  @keyframes glow-pulse { 0%,100% { opacity: .65 } 50% { opacity: 1 } }

  .hidden { display: none !important; }
</style>
  <link rel="preload" href="/fonts/zihui-wenyihei.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/shared/font.css">
  <link rel="stylesheet" href="/shared/scene-light.css?v=20261026">
</head>
<body>
<div id="stage" class="stage">
  <div class="bg" aria-hidden="true">
    <video class="bg-video" id="bgVideo" autoplay muted loop playsinline preload="auto"
           poster="/assets/liveroom-background.png">
      <source src="/assets/liveroom-background.mp4" type="video/mp4" />
    </video>
    <div class="bg-shade"></div>
  </div>

  <div class="scene">
    <header class="head">
      <span class="dot"></span>
      <span class="brand">CHUNITHM · RANDOM PICK</span>
      <span class="title">随机选曲</span>
      <span class="spacer"></span>
      <span class="phase" id="phase">READY</span>
    </header>

    <div class="reel-wrap" id="reelWrap">
      <div class="pointer-glow"></div>
      <div class="reel-viewport" id="reelViewport">
        <div class="reel-strip" id="reelStrip"></div>
      </div>
    </div>
    <div class="pointer" id="pointer"></div>

    <div class="idle" id="idle">
      <div class="ring"></div>
      <div class="t">等待随机选曲</div>
      <div class="s">在解说控制台点击「开始随机」</div>
    </div>

    <section class="result" id="result">
      <div class="glow"></div>
      <div class="result-card">
        <div class="result-cover" id="resultCover"></div>
        <div class="result-info">
          <div class="kicker">SELECTED · 已选中</div>
          <div class="result-title" id="resultTitle">—</div>
          <div class="result-artist" id="resultArtist">—</div>
          <div class="meta-line" id="resultMeta"></div>
          <div class="result-note" id="resultNote"></div>
        </div>
      </div>
    </section>
  </div>

  <!-- 曲目预览音频：OBS 浏览器源需要开启该源的音频输出 -->
  <audio id="previewAudio" preload="auto"></audio>
</div>
<script src="/shared/ws.js"></script>
<script src="/shared/scene-bg.js?v=20261026"></script>
<script src="/shared/render-theme.js?v=20261026"></script>
<script src="/shared/audio-preview.js?v=20261025"></script>
<script src="/render/random.js?v=20261028c"></script>
</body>
</html>
