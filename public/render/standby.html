<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>直播待机画面 · 街机音游赛事控制软件</title>
<!--
  直播待机画面 —— 整屏场景 / OBS 浏览器源。

  · 明亮冷色科技风（白 + 冰蓝），配色跟随「设置 → 输出配色」的强调色；
  · 背景是 assets/standby-bg.mp4（12s 无缝循环），解码失败时退回同目录 PNG；
  · 看板娘 assets/standby-mascot.png（灰底已抠除），带漂浮、呼吸与扫光；
  · 比赛名称 / 比赛时间 / 底部滚动文案都来自设置里的「待机画面」；
  · 比赛名称可勾选「跟随比赛计分」，直接显示 /match 当前局的名称。

  URL 参数：
    ?static=1   不加载视频，只用静态背景（省 GPU / 视频解码异常时）
    ?fit=1      按窗口等比缩放（控制台预览用）
    ?theme=xxx  临时预览某个输出配色
-->
<style>
  :root {
    --sb-ink: #0b1b2a;
    --sb-dim: #33546d;
    --sb-mute: #6b8ba1;
    --cyan: #2f9bd6;
    --cyan-soft: #8fd3ef;
    --hair: rgba(24, 78, 108, .16);
    --hair-strong: rgba(24, 78, 108, .3);
    --paper: rgba(255, 255, 255, .66);
    --accent: #d9a441;
    --accent-ink: #8a6420;
    --accent-soft: rgba(217, 164, 65, .18);
    --mono: ui-monospace, 'Cascadia Code', Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    background: #f3f9fd;
    color: var(--sb-ink);
    font-family: 'ZiHuiWenYiHei', 'Noto Sans SC', 'Microsoft YaHei', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    position: fixed; left: 0; top: 0;
    width: 1920px; height: 1080px;
    transform-origin: top left;
    overflow: hidden;
    background: #f3f9fd;
  }

  /* ── 背景 ────────────────────────────────────────────── */
  .bg { position: absolute; inset: 0; z-index: 0; }
  .bg-video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; display: block;
  }
  .bg-video[hidden] { display: none; }
  .bg-fallback {
    position: absolute; inset: 0;
    background: #f4fafe url('/assets/standby-bg.png') center / cover no-repeat;
    opacity: 1;
  }
  .bg-video:not([hidden]) + .bg-fallback { opacity: 0; }
  /* 视频在但没能播起来（自动播放被拦 / 解码失败）时把静态底重新露出来 */
  #stage.video-dead .bg-fallback { opacity: 1; }
  /* 上白下蓝的薄雾：让文字区更干净，同时压住视频边缘的杂色 */
  .bg-wash {
    position: absolute; inset: 0;
    background:
      linear-gradient(100deg, rgba(255,255,255,.94) 0%, rgba(255,255,255,.72) 42%, rgba(255,255,255,.12) 68%, rgba(255,255,255,0) 100%),
      linear-gradient(180deg, rgba(255,255,255,.55) 0%, rgba(255,255,255,0) 26%, rgba(255,255,255,0) 74%, rgba(226,242,252,.75) 100%);
  }

  /* ── 四角取景框 + 扫描光 ─────────────────────────────── */
  .frame { position: absolute; inset: 34px; z-index: 2; pointer-events: none; }
  .frame .corner {
    position: absolute; width: 46px; height: 46px;
    border: 2px solid var(--accent); opacity: .85;
  }
  .frame .corner::after {
    content: ''; position: absolute; width: 8px; height: 8px;
    background: var(--accent);
  }
  .frame .tl { left: 0; top: 0; border-right: 0; border-bottom: 0; }
  .frame .tl::after { left: 6px; top: 6px; }
  .frame .tr { right: 0; top: 0; border-left: 0; border-bottom: 0; }
  .frame .tr::after { right: 6px; top: 6px; }
  .frame .bl { left: 0; bottom: 0; border-right: 0; border-top: 0; }
  .frame .bl::after { left: 6px; bottom: 6px; }
  .frame .br { right: 0; bottom: 0; border-left: 0; border-top: 0; }
  .frame .br::after { right: 6px; bottom: 6px; }

  /* 竖向扫光：每 9s 从左到右扫过整个画面，非常淡 */
  .frame .sweep {
    position: absolute; top: 0; bottom: 0; width: 240px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent);
    mix-blend-mode: screen;
    animation: sweep 9s linear infinite;
  }
  @keyframes sweep {
    0%   { transform: translateX(-260px); opacity: 0; }
    12%  { opacity: .9; }
    88%  { opacity: .9; }
    100% { transform: translateX(1780px); opacity: 0; }
  }

  /* ── 顶栏 ────────────────────────────────────────────── */
  .topbar {
    position: absolute; left: 92px; right: 104px; top: 62px; z-index: 5;
    display: flex; align-items: center; gap: 16px;
  }
  .topbar .mark {
    width: 12px; height: 12px; background: var(--accent); flex: 0 0 auto;
    box-shadow: 0 0 0 4px var(--accent-soft);
    animation: mark-pulse 3.4s ease-in-out infinite;
  }
  @keyframes mark-pulse {
    0%, 100% { box-shadow: 0 0 0 4px var(--accent-soft); }
    50%      { box-shadow: 0 0 0 8px rgba(217,164,65,0); }
  }
  .brand {
    font-family: var(--mono); font-size: 17px; font-weight: 800;
    letter-spacing: 5px; color: var(--sb-ink);
  }
  .brand-sep { font-family: var(--mono); color: var(--hair-strong); font-size: 16px; }
  .brand-sub {
    font-size: 17px; font-weight: 700; letter-spacing: 1.5px; color: var(--sb-dim);
    max-width: 620px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .topbar .spacer { flex: 1; }

  .status {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 8px 16px;
    border: 1px solid var(--hair-strong);
    background: rgba(255,255,255,.55);
    backdrop-filter: blur(2px);
  }
  .status .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
    animation: dot-blink 1.8s ease-in-out infinite;
  }
  @keyframes dot-blink { 0%,100% { opacity: 1 } 50% { opacity: .25 } }
  .status b {
    font-family: var(--mono); font-size: 13px; font-weight: 800;
    letter-spacing: 3px; color: var(--accent-ink);
  }
  .clock {
    font-family: var(--mono); font-size: 26px; font-weight: 700;
    letter-spacing: 2px; color: var(--sb-ink); font-variant-numeric: tabular-nums;
    padding-left: 18px; border-left: 1px solid var(--hair);
  }
  .clock[hidden] { display: none; }

  /* ── 主内容 ──────────────────────────────────────────── */
  .content {
    position: absolute; left: 96px; top: 50%; z-index: 5;
    transform: translateY(-52%);
    width: 1000px;
    padding: 34px 40px 30px 34px;
  }
  /* 文字区的取景角标：让左侧内容块看起来是「被裁出来的一屏」 */
  .content .edge {
    position: absolute; width: 20px; height: 20px;
    border: 1px solid var(--hair-strong);
  }
  .content .edge.tl { left: 0; top: 0; border-right: 0; border-bottom: 0; }
  .content .edge.br { right: 0; bottom: 0; border-left: 0; border-top: 0; }
  .kicker { display: flex; align-items: center; gap: 14px; margin-bottom: 26px; }
  .kicker .bar {
    width: 46px; height: 3px; background: var(--accent); flex: 0 0 auto;
    animation: bar-in 6s ease-in-out infinite;
  }
  @keyframes bar-in { 0%,100% { width: 46px } 50% { width: 78px } }
  .kicker .en {
    font-family: var(--mono); font-size: 14px; font-weight: 800;
    letter-spacing: 6px; color: var(--accent-ink);
  }
  .kicker .cn { font-size: 15px; letter-spacing: 3px; color: var(--sb-mute); }

  /* 量字宽时临时用：inline-block + nowrap，scrollWidth 才是真实文本宽度 */
  .title.measuring { display: inline-block; white-space: nowrap; }

  .title {
    margin: 0;
    font-size: 96px; line-height: 1.08; font-weight: 900; letter-spacing: 2px;
    color: #0a1a29;
    background: linear-gradient(96deg, #071726 0%, #143f5c 46%, #1d6f9c 100%);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 6px 34px rgba(70, 140, 180, .12);
    word-break: break-word;
  }
  .title-rule {
    margin: 26px 0 22px;
    height: 1px; width: 100%;
    background: linear-gradient(90deg, var(--accent) 0%, var(--hair) 34%, transparent 100%);
  }

  .meta { display: flex; align-items: flex-end; gap: 54px; }
  .meta[hidden] { display: none; }
  .meta .item { display: flex; flex-direction: column; gap: 8px; }
  .meta .k {
    font-family: var(--mono); font-size: 12.5px; font-weight: 700;
    letter-spacing: 4px; color: var(--sb-mute);
  }
  .meta .v {
    font-family: var(--mono); font-size: 40px; font-weight: 700;
    letter-spacing: 1px; color: var(--sb-ink); font-variant-numeric: tabular-nums;
  }
  .meta .v .unit { font-size: 20px; letter-spacing: 2px; color: var(--sb-mute); margin-left: 8px; }

  .chips { display: flex; gap: 10px; margin-top: 34px; }
  .chip {
    font-family: var(--mono); font-size: 12.5px; font-weight: 800; letter-spacing: 2.5px;
    padding: 7px 13px; color: var(--sb-dim);
    border: 1px solid var(--hair-strong); background: rgba(255,255,255,.5);
  }
  .chip.hot { color: var(--accent-ink); border-color: var(--accent); background: var(--accent-soft); }

  /* 左下的「同步进度」装饰条：纯装饰，但有节奏地流动 */
  .sync { display: flex; align-items: center; gap: 12px; margin-top: 42px; }
  .sync .track {
    position: relative; width: 320px; height: 4px;
    background: var(--hair); overflow: hidden;
  }
  .sync .track i {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg, var(--accent) 0 14px, transparent 14px 28px);
    animation: sync-run 2.6s linear infinite;
  }
  @keyframes sync-run { from { transform: translateX(-28px) } to { transform: translateX(0) } }
  .sync .label {
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 3px; color: var(--sb-mute);
  }

  /* ── 看板娘 ──────────────────────────────────────────── */
  .mascot-zone {
    position: absolute; right: 24px; bottom: 104px; z-index: 4;
    width: 820px; height: 890px;
    pointer-events: none;
  }
  .mascot-zone[hidden] { display: none; }

  .glow {
    position: absolute; left: 50%; top: 48%;
    width: 760px; height: 760px; transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(120, 200, 235, .30) 0%, rgba(120, 200, 235, .12) 38%, rgba(120,200,235,0) 68%);
    animation: glow-breathe 7s ease-in-out infinite;
  }
  @keyframes glow-breathe { 0%,100% { opacity: .75; transform: translate(-50%,-50%) scale(1) } 50% { opacity: 1; transform: translate(-50%,-50%) scale(1.06) } }

  .rings { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .rings span {
    position: absolute; left: 50%; top: 50%; border-radius: 50%;
    border: 1px dashed rgba(47, 155, 214, .34);
    transform: translate(-50%, -50%);
  }
  .rings span:nth-child(1) { width: 520px; height: 520px; animation: spin 34s linear infinite; }
  .rings span:nth-child(2) { width: 660px; height: 660px; border-style: solid; border-color: rgba(47, 155, 214, .16); animation: spin-rev 48s linear infinite; }
  .rings span:nth-child(3) { width: 800px; height: 800px; border-color: rgba(47, 155, 214, .10); animation: spin 64s linear infinite; }
  @keyframes spin { from { transform: translate(-50%,-50%) rotate(0) } to { transform: translate(-50%,-50%) rotate(360deg) } }
  @keyframes spin-rev { from { transform: translate(-50%,-50%) rotate(360deg) } to { transform: translate(-50%,-50%) rotate(0) } }

  .mascot {
    position: absolute; left: 50%; bottom: 0;
    height: 890px; width: auto;
    transform: translateX(-50%);
    filter: drop-shadow(0 26px 44px rgba(23, 74, 104, .22));
    animation: mascot-float 7.5s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes mascot-float {
    0%, 100% { transform: translateX(-50%) translateY(0) rotate(-.25deg); }
    50%      { transform: translateX(-50%) translateY(-16px) rotate(.25deg); }
  }

  /* 扫光：用立绘自己做蒙版，光只会扫在角色身上 */
  .shine {
    position: absolute; left: 50%; bottom: 0; height: 890px; width: 720px;
    transform: translateX(-50%);
    background: linear-gradient(104deg,
      transparent 38%, rgba(255,255,255,.55) 47%,
      rgba(150, 225, 255, .55) 51%, transparent 60%);
    -webkit-mask: url('/assets/standby-mascot.png') center bottom / contain no-repeat;
    mask: url('/assets/standby-mascot.png') center bottom / contain no-repeat;
    mix-blend-mode: screen;
    opacity: 0;
    animation: shine 6.4s ease-in-out infinite;
  }
  @keyframes shine {
    0%, 58%  { opacity: 0; transform: translateX(-50%) translateX(-260px); }
    64%      { opacity: .95; }
    88%      { opacity: 0; transform: translateX(-50%) translateX(280px); }
    100%     { opacity: 0; }
  }

  /* 角色周围的 HUD 角标 */
  .hud {
    position: absolute; font-family: var(--mono); font-size: 11px;
    letter-spacing: 3px; color: var(--sb-mute); opacity: .9;
  }
  .hud.a { left: 4px; top: 250px; writing-mode: vertical-rl; }
  /* 读数放在文字区与角色之间的留白里，绝不压在立绘上 */
  .hud.b { left: -64px; bottom: 150px; text-align: left; line-height: 1.9; }
  .hud .ok { color: var(--accent-ink); font-weight: 800; }
  .hud .tick {
    display: block; width: 46px; height: 1px; background: var(--hair-strong);
    margin: 8px 0;
  }
  .hud.b .dotline {
    display: inline-block; width: 6px; height: 6px; background: var(--accent);
    margin-right: 6px; animation: dot-blink 2.2s ease-in-out infinite;
  }

  /* ── 底部滚动条 ──────────────────────────────────────── */
  .ticker {
    position: absolute; left: 92px; right: 92px; bottom: 62px; z-index: 5;
    display: flex; align-items: center; gap: 18px;
    border-top: 1px solid var(--hair);
    padding-top: 16px;
  }
  .ticker[hidden] { display: none; }
  .tick-label {
    font-family: var(--mono); font-size: 11.5px; font-weight: 800;
    letter-spacing: 3px; color: #fff;
    background: var(--accent); padding: 5px 11px; flex: 0 0 auto;
  }
  .tick-viewport { flex: 1; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 3%, #000 94%, transparent); }
  .tick-track {
    display: inline-flex; white-space: nowrap; will-change: transform;
    animation: marquee var(--marquee-dur, 26s) linear infinite;
  }
  .tick-track span {
    font-size: 15px; letter-spacing: 2px; color: var(--sb-dim); padding-right: 64px;
  }
  .tick-track span i { color: var(--accent); font-style: normal; padding: 0 8px; }
  @keyframes marquee { from { transform: translateX(0) } to { transform: translateX(-50%) } }

  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }
</style>
  <link rel="preload" href="/fonts/zihui-wenyihei.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/shared/font.css">
</head>
<body>
<div id="stage">
  <div class="bg" aria-hidden="true">
    <video class="bg-video" id="bgVideo" autoplay muted loop playsinline preload="auto"
           poster="/assets/standby-bg.png">
      <source src="/assets/standby-bg.mp4" type="video/mp4" />
    </video>
    <div class="bg-fallback"></div>
    <div class="bg-wash"></div>
  </div>

  <div class="frame" aria-hidden="true">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>
    <span class="sweep"></span>
  </div>

  <header class="topbar">
    <span class="mark"></span>
    <span class="brand">CHUNITHM</span>
    <span class="brand-sep">/</span>
    <span class="brand-sub" id="eventName">TOURNAMENT</span>
    <span class="spacer"></span>
    <span class="status"><i class="dot"></i><b id="statusText">STANDBY</b></span>
    <span class="clock" id="clock">--:--:--</span>
  </header>

  <main class="content">
    <span class="edge tl" aria-hidden="true"></span>
    <span class="edge br" aria-hidden="true"></span>
    <div class="kicker">
      <span class="bar"></span>
      <span class="en">MATCH INFORMATION</span>
      <span class="cn">比赛信息</span>
    </div>
    <h1 class="title" id="matchName">比赛即将开始</h1>
    <div class="title-rule"></div>

    <div class="meta" id="metaRow">
      <div class="item">
        <span class="k">比赛时间 / TIME</span>
        <span class="v" id="matchTime">待定</span>
      </div>
    </div>

    <div class="chips">
      <span class="chip hot" id="chipState">READY</span>
      <span class="chip" id="chipEvent">TOURNAMENT</span>
    </div>

    <div class="sync" aria-hidden="true">
      <span class="track"><i></i></span>
      <span class="label">SYSTEM ONLINE</span>
    </div>
  </main>

  <div class="mascot-zone" id="mascotZone">
    <div class="glow"></div>
    <div class="rings"><span></span><span></span><span></span></div>
    <img class="mascot" id="mascot" src="/assets/standby-mascot.png" alt="">
    <div class="shine"></div>
    <div class="hud a">CHUNITHM // STANDBY</div>
    <div class="hud b">
      <span class="dotline"></span><span class="ok">LINK ESTABLISHED</span><br>
      <span class="tick"></span>
      UNIT&nbsp;01 · 待机
    </div>
  </div>

  <footer class="ticker" id="ticker">
    <span class="tick-label">NOTICE</span>
    <div class="tick-viewport"><div class="tick-track" id="tickTrack"></div></div>
  </footer>
</div>

<script src="/shared/ws.js"></script>
<script src="/shared/render-theme.js?v=20261026"></script>
<script src="/render/standby.js?v=20261026"></script>
</body>
</html>
