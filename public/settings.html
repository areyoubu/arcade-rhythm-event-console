<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>设置 · 街机音游赛事控制软件</title>
<link rel="stylesheet" href="/shared/style.css">
<style>
  .settings-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }

  .group-card { scroll-margin-top: calc(var(--toc-top, 76px) + 16px); }
  .group-card > header .icon { font-size: 16px; }
  .group-card > header .desc {
    font-weight: 500; font-size: 12px; color: var(--text-mute);
    margin-left: auto; max-width: 62%; text-align: right; line-height: 1.45;
  }
  @media (max-width: 820px) { .group-card > header .desc { display: none; } }

  /* 字段网格：默认单列，宽屏双列（长文本字段跨两列） */
  .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 22px; }
  .fields > .field.span2 { grid-column: 1 / -1; }
  @media (max-width: 980px) { .fields { grid-template-columns: minmax(0, 1fr); } }

  .field .label-row { display: flex; align-items: center; gap: 7px; margin-bottom: 5px; }
  .field .label-row label { font-size: 12.5px; font-weight: 700; color: var(--text-dim); }
  .restart-badge {
    font-size: 10.5px; font-weight: 700; padding: 0 6px; border-radius: 5px;
    background: #33280e; border: 1px solid #7a5d13; color: #f5c451; white-space: nowrap;
  }
  .pw-wrap { position: relative; }
  .pw-wrap input { padding-right: 62px; }
  .pw-wrap .toggle {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: transparent; border: none; color: var(--text-mute);
    font-size: 11.5px; cursor: pointer; padding: 3px 7px; font-family: inherit;
  }
  .pw-wrap .toggle:hover { color: var(--text); }

  .unit { position: relative; }
  .unit input { padding-right: 44px; }
  .unit .u {
    position: absolute; right: 11px; top: 50%; transform: translateY(-50%);
    color: var(--text-mute); font-size: 11.5px; pointer-events: none;
  }

  .save-bar {
    position: sticky; bottom: 0; z-index: 40;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 11px 16px; margin-top: 16px;
    background: var(--surface);
    border: 1px solid var(--border); border-radius: var(--radius-lg);
    backdrop-filter: none;
  }
  .save-bar .dirty-dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--text-mute); flex: 0 0 auto;
  }
  .save-bar.dirty .dirty-dot { background: var(--warn); }
  .save-bar .spacer { flex: 1; }
  .test-result { margin-top: 9px; font-size: 12.5px; line-height: 1.65; }
  .test-result pre {
    margin: 6px 0 0; padding: 8px 10px; background: #17181b;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 11.5px; max-height: 220px; overflow: auto; white-space: pre-wrap; word-break: break-all;
  }

  /*
   * 左侧目录跟随窗口滚动。
   *
   * ⚠️ 关键在于「目录列必须撑满整行」：父级 .cols 用 alignItems:start 时，
   * 列高会收缩成目录自身的高度，sticky 元素在容器内没有任何可移动区间，
   * 于是滚动时目录会跟着页面一起被推走（这就是之前「不好选择其他项目」的原因）。
   * 给列加 align-self:stretch 后，列高 = 右侧内容高度，sticky 才有活动空间。
   */
  .toc-col { align-self: stretch; }
  .toc {
    position: sticky; top: var(--toc-top, 76px);
    max-height: calc(100vh - var(--toc-top, 76px) - 18px);   /* 分组多时目录内部自己滚，不遮住页面 */
    overflow-y: auto;
    overscroll-behavior: contain;
  }
  .toc a {
    display: block; padding: 5px 10px; border-radius: 7px;
    color: var(--text-dim); font-size: 12.5px; font-weight: 600;
  }
  .toc a:hover { background: var(--surface-3); color: var(--text); text-decoration: none; }
  .toc a.on { background: rgba(255,255,255,.10); color: #fff; }
  /* 目录里的一级分类 */
  .toc .toc-tier {
    margin: 10px 0 3px; padding: 0 10px;
    font-size: 10.5px; font-weight: 800; letter-spacing: .1em;
    color: var(--text-mute);
  }
  .toc .toc-tier:first-child { margin-top: 2px; }
  /* 正文里的一级分类标题 */
  .tier-head {
    display: flex; align-items: baseline; gap: 10px;
    margin: 6px 0 -4px; padding: 0 2px 8px;
    border-bottom: 1px solid var(--border);
  }
  .tier-head b { font-size: 14px; letter-spacing: .04em; }
  .tier-head span { font-size: 11.5px; color: var(--text-mute); }
  .tier-head:not(:first-child) { margin-top: 22px; }
</style>
  <link rel="preload" href="/fonts/zihui-wenyihei.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/shared/font.css">
</head>
<body>
<script src="/shared/format.js"></script>
<script src="/shared/ui.js"></script>
<script src="/shared/ws.js"></script>
<script>
'use strict';
(function () {
  const { el, clear, esc } = ui;

  const page = ui.mount({ current: '/settings', title: '设置', subtitle: '所有接口地址与运行参数都在这里配置 —— 切换单机 / 双机部署只需改本页，不需要动代码' });

  // 顶栏是 sticky 且窄屏会换行，高度不是常数 —— 目录的 sticky 偏移必须跟着实测高度走，
  // 否则换行后目录上半截会钻到顶栏底下。
  function syncTocTop() {
    const bar = document.querySelector('.topbar');
    const h = bar ? bar.getBoundingClientRect().height : 56;
    document.documentElement.style.setProperty('--toc-top', `${Math.round(h + 10)}px`);
  }
  syncTocTop();
  window.addEventListener('resize', syncTocTop);
  if (window.ResizeObserver) new ResizeObserver(syncTocTop).observe(document.querySelector('.topbar'));

  // 页面骨架：左侧目录 + 右侧分区卡片
  const layout = el('div', { class: 'cols', style: { gridTemplateColumns: 'minmax(0,190px) minmax(0,1fr)', alignItems: 'start' } });
  const tocCol = el('div', { class: 'toc-col' }, el('div', { class: 'card toc' },
    el('header', null, '配置分区'),
    el('div', { class: 'body tight', id: 'toc' }),
  ));
  const mainCol = el('div', { class: 'settings-grid', id: 'groups' });
  layout.append(tocCol, mainCol);
  page.append(layout);

  // 保存条
  const dirtyDot = el('span', { class: 'dirty-dot' });
  const dirtyText = el('span', { class: 'small dim', text: '没有未保存的修改' });
  const saveBar = el('div', { class: 'save-bar' },
    dirtyDot, dirtyText,
    el('span', { class: 'spacer' }),
    el('button', { class: 'btn ghost sm', text: '重新载入', onclick: () => load(true) }),
    el('button', { class: 'btn ghost sm', text: '导出配置', onclick: exportConfig }),
    el('button', { class: 'btn ghost sm', text: '导入配置', onclick: importConfig }),
    el('button', { class: 'btn ghost sm', text: '恢复默认', onclick: resetConfig }),
    el('button', { class: 'btn primary', id: 'btnSave', text: '保存修改', disabled: true, onclick: save }),
  );
  page.append(saveBar);

  // 状态
  let SCHEMA = { groups: [], fields: [] };
  let CFG = {};                 // 服务端当前配置（含掩码值）
  let dirty = {};               // path -> 新值
  const controls = new Map();   // path -> { input, field, get, set, path }
  const cards = new Map();      // groupId -> card element

  // ══════════════════════════════════════════════════════
  // 加载
  // ══════════════════════════════════════════════════════
  async function load(verbose) {
    try {
      const d = await ui.api('/api/config');
      SCHEMA = d.schema;
      CFG = d.config;
      dirty = {};
      render();
      if (verbose) ui.ok('已重新载入服务端配置，未保存的修改已丢弃');
      applyHashAnchor();
    } catch (e) { /* api() 已提示 */ }
  }

  // ══════════════════════════════════════════════════════
  // 渲染
  // ══════════════════════════════════════════════════════
  function render() {
    clear(mainCol);
    clear(document.getElementById('toc'));
    controls.clear();
    cards.clear();

    const toc = document.getElementById('toc');

    /*
     * 按一级分类（tier）分块渲染：常用 / 设备与连接 / 直播画面 / 比赛与互动 /
     * 回放与转场 / 数据与日志。以前 20 多个分区平铺，找一项要滚很久。
     */
    const tiers = SCHEMA.tiers || [{ id: null, label: '', desc: '' }];
    const tierOf = (g) => (SCHEMA.tiers || []).find((t) => t.id === g.tier);

    for (const tier of tiers) {
      const groups = SCHEMA.groups.filter((g) => (tier.id ? g.tier === tier.id : true));
      const visible = groups.filter((g) => SCHEMA.fields.some((f) => f.group === g.id));
      if (!visible.length) continue;

      if (tier.label) {
        mainCol.append(el('div', { class: 'tier-head' },
          el('b', { text: tier.label }),
          tier.desc ? el('span', { text: tier.desc }) : null,
        ));
        toc.append(el('div', { class: 'toc-tier', text: tier.label }));
      }

      for (const g of visible) {
      const fields = SCHEMA.fields.filter((f) => f.group === g.id);
      if (!fields.length) continue;

      const basic = fields.filter((f) => !f.advanced);
      const advanced = fields.filter((f) => f.advanced);

      const body = el('div', { class: 'body' });
      const grid = el('div', { class: 'fields' });
      for (const f of basic) grid.append(renderField(f));
      body.append(grid);

      const card = el('div', { class: 'card group-card', id: `group-${g.id}`, dataset: { group: g.id } },
        el('header', null,
          el('span', { text: g.label }),
          el('span', { class: 'desc', text: g.desc || '' }),
        ),
        body,
      );

      if (advanced.length) {
        const advGrid = el('div', { class: 'fields' });
        for (const f of advanced) advGrid.append(renderField(f));
        const advBody = el('div', { class: 'body', style: { display: 'none', borderTop: '1px solid var(--border)' } }, advGrid);
        const toggle = el('button', {
          class: 'btn ghost sm', text: `▸ 高级（${advanced.length}）`,
          style: { marginTop: '4px' },
          onclick: () => {
            const open = advBody.style.display === 'none';
            advBody.style.display = open ? '' : 'none';
            toggle.textContent = `${open ? '▾' : '▸'} 高级（${advanced.length}）`;
          },
        });
        body.append(toggle, advBody);
      }

      // 分区专属的「测试 / 操作」按钮
      const actions = groupActions(g.id);
      if (actions) body.append(el('div', { class: 'divider' }), actions);

      mainCol.append(card);
      cards.set(g.id, card);

      toc.append(el('a', { href: `#${g.id}`, text: g.label, onclick: (e) => { e.preventDefault(); jumpTo(g.id); } }));
      }
    }

    syncDirty();
  }

  function renderField(f) {
    const value = dirty[f.path] !== undefined ? dirty[f.path] : getPath(CFG, f.path);
    const field = el('div', { class: 'field', dataset: { path: f.path } });
    field.append(el('div', { class: 'label-row' },
      el('label', { text: f.label }),
      f.restart ? el('span', { class: 'restart-badge', text: '需重连', title: '修改后需要重新连接对应服务才生效' }) : null,
      f.sensitive ? el('span', { class: 'restart-badge', style: { background: '#2b2e33', borderColor: '#4b4f57', color: '#b9bdc4' }, text: '敏感' }) : null,
    ));

    let input;
    const onChange = (v) => markDirty(f.path, v);
    // 布尔项把标签挪进 switch 里，避免出现「标题 + 又一行同名标签」的重复
    const labelRow = field.firstChild;

    switch (f.type) {
      case 'boolean': {
        const cb = el('input', { type: 'checkbox', onchange: () => onChange(cb.checked) });
        cb.checked = !!value;
        input = cb;
        // 复选框自带可点击标题，所以丢掉上面那行 label-row
        labelRow.remove();
        field.append(el('label', { class: 'check' }, cb, el('span', { class: 'label', text: f.label })));
        break;
      }
      case 'select': {
        const sel = el('select', { onchange: () => onChange(sel.value) });
        for (const o of f.options || []) sel.append(el('option', { value: o, text: o, selected: o === value }));
        input = sel;
        field.append(sel);
        break;
      }
      case 'password': {
        const inp = el('input', { type: 'password', value: value ?? '', placeholder: f.placeholder || '', oninput: () => onChange(inp.value) });
        const toggle = el('button', {
          class: 'toggle', type: 'button', text: '显示',
          onclick: () => {
            const show = inp.type === 'password';
            inp.type = show ? 'text' : 'password';
            toggle.textContent = show ? '隐藏' : '显示';
          },
        });
        input = inp;
        field.append(el('div', { class: 'pw-wrap' }, inp, toggle));
        break;
      }
      case 'textarea':
      case 'json': {
        const val = f.type === 'json' ? JSON.stringify(value ?? {}, null, 2) : (value ?? '');
        const ta = el('textarea', { placeholder: f.placeholder || '', oninput: () => onChange(parseMaybeJson(f, ta.value)) });
        ta.value = val;
        input = ta;
        field.append(ta);
        break;
      }
      case 'number':
      case 'ms':
      case 'port': {
        const inp = el('input', {
          type: 'number', value: value ?? '',
          min: f.min, max: f.max, step: f.step || 1,
          oninput: () => onChange(inp.value === '' ? '' : Number(inp.value)),
        });
        input = inp;
        const unit = f.unit || (f.type === 'ms' ? 'ms' : '');
        field.append(unit ? el('div', { class: 'unit' }, inp, el('span', { class: 'u', text: unit })) : inp);
        if (f.path === 'clip.maxLookbackMs') {
          const hint = el('div', { class: 'help warn' });
          const upd = () => {
            const v = Number(inp.value) || 0;
            hint.textContent = `≈ ${(v / 1000).toFixed(1)} 秒 · 须 ≤ vMix 回放会话缓冲容量（R10 待实测回填），超出会导致入点被静默截断`;
          };
          inp.addEventListener('input', upd); upd();
          field.append(hint);
        }
        break;
      }
      case 'list':
      case 'list-number': {
        const val = Array.isArray(value) ? value.join(', ') : (value ?? '');
        const inp = el('input', { type: 'text', value: val, placeholder: f.placeholder || '', oninput: () => onChange(inp.value) });
        input = inp;
        field.append(inp);
        break;
      }
      case 'color': {
        const inp = el('input', { type: 'color', value: value || '#ffffff', oninput: () => onChange(inp.value) });
        input = inp;
        field.append(el('div', { class: 'inline' }, inp, el('span', { class: 'mono small dim', text: String(value || '') })));
        break;
      }
      case 'url':
      default: {
        const inp = el('input', {
          type: 'text', value: value ?? '',
          placeholder: f.placeholder || (f.path.endsWith('.url') ? '留空表示未配置' : ''),
          oninput: () => onChange(inp.value),
        });
        input = inp;
        field.append(inp);
        break;
      }
    }

    controls.set(f.path, {
      input, field, path: f.path,
      get: () => {
        if (f.type === 'boolean') return input.checked;
        if (f.type === 'json') return parseMaybeJson(f, input.value);
        if (f.type === 'number' || f.type === 'ms' || f.type === 'port') return input.value === '' ? '' : Number(input.value);
        return input.value;
      },
      set: (v) => {
        if (f.type === 'boolean') { input.checked = !!v; return; }
        if (f.type === 'json') { input.value = JSON.stringify(v ?? {}, null, 2); return; }
        input.value = Array.isArray(v) ? v.join(', ') : (v ?? '');
      },
      /** 回滚到服务端当前值 */
      reset: () => controls.get(f.path).set(getPath(CFG, f.path)),
    });

    // 图片类配置：可以直接从媒体库挑，不用手动复制 URL
    if (f.path === 'cast.camLogo' || f.path === 'cast.camCarouselImages') {
      const multi = f.path === 'cast.camCarouselImages';
      field.append(el('button', {
        class: 'btn sm ghost mt8', type: 'button',
        text: multi ? '从图片库选择（可多选）' : '从图片库选择',
        onclick: () => {
          const current = multi
            ? String(input.value).split(',').map((s) => s.trim()).filter(Boolean)
            : [String(input.value).trim()].filter(Boolean);
          ui.mediaPicker({
            multiple: multi,
            selected: current,
            title: multi ? '选择轮播图片' : '选择比赛 Logo',
            onPick: (urls) => {
              input.value = multi ? urls.join(', ') : (urls[0] || '');
              onChange(input.value);
            },
          });
        },
      }));
    }

    if (f.help) field.append(el('div', { class: 'help', html: linkifyHelp(f.help) }));
    field.append(el('div', { class: 'err', style: { display: 'none' } }));
    return field;
  }

  function linkifyHelp(text) {
    return esc(text)
      .replace(/(http:\/\/[^\s，。]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
      .replace(/\*\*(.+?)\*\*/g, '<strong style="color:#e6e9f0">$1</strong>')
      .replace(/★/g, '')
      .replace(/⚠️|⚠/g, '<span style="color:#f5c451">⚠</span>');
  }

  function parseMaybeJson(f, raw) {
    if (f.type !== 'json') return raw;
    try { return raw.trim() === '' ? {} : JSON.parse(raw); } catch { return raw; }   // 非法 JSON 原样提交，让服务端报路径错误
  }

  // ══════════════════════════════════════════════════════
  // 分区专属操作
  // ══════════════════════════════════════════════════════
  function groupActions(groupId) {
    switch (groupId) {
      case 'features':
        return el('div', { class: 'note info', html:
          '勾选后<strong>保存即生效</strong>，不需要重启：开启会立即连接对应设备并启动轮询，取消则断开并停止轮询。<br>'
          + '依赖关系：<strong>回放</strong>需要先开 <strong>vMix 控制</strong>；<strong>回放转场</strong>需要先开 <strong>OBS 控制</strong>。'
          + '未启用时顶部导航不会显示对应页面，首页会标注「未启用」。' });
      case 'obs':
        return testRow('obs', '测试 OBS 连接', '会做一次独立的 WebSocket 握手，不影响正在使用的连接。');
      case 'vmix':
        return testRow('vmix', '测试 vMix 连接', '发一次不带参数的 GET /api/（与心跳同款），并顺带探测回放输入。');
      case 'gameAudio': {
        const out = el('div', { class: 'test-result', style: { display: 'none' } });
        const statusLine = el('div', { class: 'small muted', text: '正在读取游戏音频状态…' });
        const idInput = el('input', { type: 'number', min: '1', step: '1', placeholder: '曲目 ID，例如 487', style: { width: '190px' } });
        const scanBtn = el('button', { class: 'btn sm', type: 'button', text: '扫描游戏目录' });
        const clearBtn = el('button', { class: 'btn sm ghost', type: 'button', text: '清理预览缓存' });
        const testBtn = el('button', { class: 'btn sm ghost', type: 'button', text: '试听预览' });

        function describe(d) {
          const parts = [];
          if (d.index) {
            parts.push(`已索引 ${d.index.ids} 首`);
            parts.push(`${d.index.awbFiles} 个 AWB`);
            parts.push(`${d.index.roots} 个资源目录`);
            if (d.index.duplicates) parts.push(`${d.index.duplicates} 个重复 ID`);
          }
          if (d.cache) parts.push(`缓存 ${d.cache.files} 个 / ${(d.cache.bytes / 1024 / 1024).toFixed(1)} MB`);
          return parts.join(' · ') || '没有扫描到可用音频';
        }

        function show(d, { scannedResult = false } = {}) {
          out.style.display = '';
          clear(out);
          const isScanned = !!d.index;
          statusLine.textContent = d.configuredDir
            ? (isScanned ? describe(d) : '游戏目录已配置，但还没有扫描（点「扫描游戏目录」）')
            : '尚未配置游戏目录';
          statusLine.className = `small ${d.configuredDir ? (isScanned ? 'muted' : 'dim') : 'muted'}`;

          out.append(el('div', { class: `note ${isScanned ? 'ok' : 'warn'}`,
            text: isScanned
              ? `${scannedResult ? '扫描完成：' : ''}${describe(d)}`
              : (d.errors?.[0] || '没有扫描到 cueFile。请确认填的是包含 data / option 的游戏根目录。') }));

          if (d.gameDir && d.configuredDir && d.gameDir !== d.configuredDir) {
            out.append(el('div', { class: 'note info mt8',
              text: '刚才扫描的是输入框中的目录。点「保存修改」后，播放预览才会使用这个目录。' }));
          }
          if (d.errors?.length) {
            out.append(el('pre', { text: d.errors.slice(0, 8).join('\n') }));
          }
        }

        async function refresh() {
          try {
            const d = await ui.api('/api/game-audio/status');
            show(d);
          } catch (e) {
            statusLine.textContent = `读取失败：${e.message}`;
          }
        }

        scanBtn.onclick = () => ui.withBusy(scanBtn, async () => {
          try {
            const dir = String(currentVal('gameAudio.gameDir') || '').trim();
            const d = await ui.api('/api/game-audio/scan', { method: 'POST', body: { gameDir: dir } });
            show(d, { scannedResult: true });
            ui.ok(d.index ? `扫描完成：${d.index.ids} 首曲目` : '扫描完成，但没有找到 cueFile');
          } catch (e) {
            ui.warn(`扫描失败：${e.message}`);
          }
        });

        clearBtn.onclick = () => ui.withBusy(clearBtn, async () => {
          try {
            const d = await ui.api('/api/game-audio/cache/clear', { method: 'POST', body: {} });
            ui.ok(`已清理 ${d.removed} 个缓存文件（${(d.bytes / 1024 / 1024).toFixed(1)} MB）`);
            refresh();
          } catch (e) {
            ui.warn(`清理失败：${e.message}`);
          }
        });

        testBtn.onclick = () => {
          const id = Number(idInput.value);
          if (!Number.isSafeInteger(id) || id <= 0) { ui.warn('先填一个曲目 ID'); return; }
          const audio = new Audio(`/api/audio/preview?id=${id}`);
          audio.volume = Number(currentVal('gameAudio.volume')) || 0.8;
          audio.play().then(() => ui.ok(`正在试听曲目 ${id} 的预览`))
            .catch(() => ui.warn('试听失败：请先保存设置并确认游戏目录已经扫描、该 ID 存在音频'));
        };

        refresh();
        return el('div', null,
          el('div', { class: 'note info', html:
            '这项功能用于在 OBS 里播放本地游戏曲目的短预览。使用前：<br>'
            + '1. 填游戏安装根目录（包含 <code>data</code> 与 <code>option</code> 或 <code>bin/option</code>），保存设置；<br>'
            + '2. 点「扫描游戏目录」确认能按 ID 找到 <code>cueFile/cueFileXXXXXX/*.awb</code>；<br>'
            + '3. 在 OBS 的随机选曲 / 选手选曲展示浏览器源里勾选「通过 OBS 控制音频」，'
            + '并在音频混合器确认该源没有静音；如果开了监听，请设为「监听并输出」。<br>'
            + '浏览器直接打开时，如果底部出现「点击启用声音」，点一下即可（浏览器默认禁止无操作自动播放）；'
            + 'OBS 浏览器源里右键「交互」点一次同样有效。之后同一页面会记住授权，预览音频会带缓入缓出自动播放。'
            + '建议关闭该浏览器源的「不可见时关闭源」，避免每次切场景都重新加载页面、需要再授权一次。<br>'
            + '4. 随机选曲控制页与选手选曲展示控制页都可以单独关闭预览音频。<br>'
            + '双人选手选曲展示默认播放 P1 的第一首展示曲目；单人展示播放当前选手的曲目。'
            + '<br><br>程序只读游戏目录中的 <code>cueFile</code> 音频文件，不会修改游戏文件，也不会读取存档或其他数据；'
            + '解码后的 WAV 缓存在程序的 <code>data/audio-cache</code>。不同版本 / 区服的音频密钥可能不同，'
            + '如果扫描到了曲目但试听失败，通常是版本或区服不匹配。' }),
          el('div', { class: 'inline mt12' }, scanBtn, clearBtn),
          statusLine,
          out,
          el('div', { class: 'divider' }),
          el('div', { class: 'inline' }, idInput, testBtn,
            el('span', { class: 'small muted', text: '试听使用已保存的设置；修改目录后请先保存。' })),
        );
      }
      case 'cnMusic':
        return el('div', null,
          el('div', { class: 'note info', html:
            '国服曲目与定数来自 <a href="https://maimai.lxns.net/docs/api/chunithm" target="_blank" rel="noopener">LXNS 公共 API</a>。'
            + '自动同步只会在后台拉取并生成「待确认更新」，仍需在 <a href="/music">曲目库</a> 弹窗里手动确认后才会写入。'
            + '<br>日服定数与曲绘来自本地游戏目录，目录在「游戏音频」分区设置；导入入口也在 <a href="/music">曲目库</a>。' }),
          el('div', { class: 'inline mt12' },
            el('a', { class: 'btn sm', href: '/music', text: '打开曲目库 →' }),
            el('span', { class: 'small muted', text: '在曲目库可切换日服 / 国服定数、导入游戏曲目、手动同步国服数据。' }),
          ),
        );
      case 'transitions':
        return el('div', null,
          el('div', { class: 'inline' },
            el('button', { class: 'btn sm', text: '读取 OBS 当前转场与覆盖', onclick: (e) => ui.withBusy(e.target, async () => { const d = await ui.api('/api/transitions/refresh', { method: 'POST' }); ui.ok(`已读取：当前转场 ${d.current?.name || '—'}`); }) }),
            el('button', { class: 'btn sm', text: '把配置中的覆盖写回 OBS', onclick: (e) => ui.withBusy(e.target, async () => { const d = await ui.api('/api/transitions/applyOverrides', { method: 'POST' }); const bad = (d.results || []).filter((x) => !x.ok); bad.length ? ui.warn(`${bad.length} 个场景下发失败`) : ui.ok('全部场景覆盖已写回 OBS'); }) }),
          ),
          el('div', { class: 'note warn mt12', html: 'stinger 的 <strong>Transition Point 是实例自身属性，obs-websocket 无法修改</strong>，必须由操作员在 OBS 里手动设置（设在不透明区正中）。' }),
        );
      case 'server':
        return el('div', null,
          el('div', { class: 'note info', html: '修改端口后需要<strong>重启服务进程</strong>才会生效（页面顶部会给出提示）。双机部署时把监听地址设为 <code>0.0.0.0</code> 才能让解说端平板访问。' }),
          el('div', { class: 'inline mt12' },
            el('a', { class: 'btn sm', href: '/admin-setup', text: '后台密码设置（仅内网）' }),
            el('span', { class: 'small muted', text: '修改登录密码 / 初始化密码；该页面只接受内网请求。' }),
          ),
        );
      case 'logging':
        return el('div', { class: 'inline' },
          el('button', { class: 'btn sm', text: '复制日志目录路径', onclick: (e) => ui.withBusy(e.target, () => copyPath('logs')) }),
          el('button', { class: 'btn sm ghost', text: '查看日志页 →', onclick: () => { location.href = '/logs'; } }),
        );
      case 'render':
      case 'media':
      case 'cue':
        return el('div', { class: 'inline' },
          el('button', { class: 'btn sm ghost', text: '复制目录路径', onclick: (e) => ui.withBusy(e.target, () => copyPath(groupId === 'media' ? 'media' : 'data')) }),
          groupId === 'render' ? el('a', { class: 'btn sm ghost', href: '/render/main?preview=1&guides=1', target: '_blank', text: '打开渲染端预览 →' }) : null,
        );
      default:
        return null;
    }
  }

  function testRow(kind, label, note) {
    const out = el('div', { class: 'test-result', style: { display: 'none' } });
    const btn = el('button', { class: 'btn sm', text: label, onclick: () => runTest(kind, btn, out) });
    return el('div', null, el('div', { class: 'inline' }, btn, note ? el('span', { class: 'small muted', text: note }) : null), out);
  }

  async function runTest(kind, btn, out) {
    out.style.display = '';
    clear(out);
    out.append(el('span', { class: 'muted', text: '测试中…' }));
    await ui.withBusy(btn, async () => {
      try {
        let body = {};
        if (kind === 'obs') body = { host: currentVal('obs.host'), port: currentVal('obs.port'), password: currentVal('obs.password') };
        if (kind === 'vmix') body = { host: currentVal('vmix.host'), port: currentVal('vmix.port') };
        const d = await ui.api(`/api/config/test/${kind}`, { method: 'POST', body });
        renderTestResult(out, kind, d);
      } catch (e) {
        clear(out);
        out.append(el('div', { class: 'note danger', text: `测试失败：${e.message}` }));
      }
    });
  }

  function renderTestResult(out, kind, d) {
    clear(out);
    const good = d.ok !== false;
    out.append(el('div', { class: `note ${good ? 'ok' : 'danger'}`, text: d.verdict || d.message || (good ? '连接正常' : '连接失败') }));

    const lines = [];
    if (d.rttMs !== undefined) lines.push(`往返耗时：${Math.round(d.rttMs)} ms`);
    if (d.obsVersion) lines.push(`OBS 版本：${d.obsVersion}`);
    if (d.obsWebSocketVersion) lines.push(`obs-websocket：${d.obsWebSocketVersion}`);
    if (d.version) lines.push(`vMix 版本：${d.version}`);
    if (d.imageFormats?.length) lines.push(`截图可用格式（RC7）：${d.imageFormats.join(', ')}`);
    if (d.authRequired) lines.push('OBS 已启用鉴权');
    if (d.authFailed) lines.push('鉴权失败：密码不正确');
    if (kind === 'vmix') {
      if (d.hasReplay && d.replayInput) {
        lines.push(`回放输入：${d.replayInput.title || '(无标题)'} · 编号 ${d.replayInput.number} · 状态 ${d.replayInput.state} · 时长 ${d.replayInput.duration}`);
      } else {
        lines.push('未在 vMix 中检测到 type="Replay" 的输入 —— 回放功能需要 vMix 4K / Pro / Max 并已建立回放会话');
      }
    }
    if (d.error) lines.push(`错误：${d.error}`);
    if (lines.length) out.append(el('pre', { text: lines.join('\n') }));
    if (d.note) out.append(el('div', { class: 'small muted mt8', text: d.note }));
    if (d.hint) out.append(el('div', { class: 'small muted mt8', text: d.hint }));
  }

  function fmtProbe(p) {
    if (!p) return '未测试';
    if (!p.reachable) return `不可达（${p.message || p.reason}）`;
    return `可达 · ${p.message || ''} ${p.note ? '· ' + p.note : ''}`.trim();
  }

  function currentVal(path) {
    if (dirty[path] !== undefined) return dirty[path];
    return getPath(CFG, path);
  }

  async function copyPath(which) {
    try {
      const d = await ui.api('/api/paths');
      const p = d.paths?.[which] || d.root;
      if (!p) return ui.warn('没有这个目录');
      try {
        await navigator.clipboard.writeText(p);
      } catch {
        const ta = document.createElement('textarea');
        ta.value = p;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.append(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      ui.ok(`已复制路径：${p}`);
    } catch (e) {
      ui.warn(`读取路径失败：${e.message}`);
    }
  }

  // ══════════════════════════════════════════════════════
  // 脏值跟踪与保存
  // ══════════════════════════════════════════════════════
  function markDirty(path, value) {
    const orig = getPath(CFG, path);
    if (JSON.stringify(value) === JSON.stringify(orig)) delete dirty[path];
    else dirty[path] = value;
    syncDirty();
  }

  function syncDirty() {
    const n = Object.keys(dirty).length;
    const btn = document.getElementById('btnSave');
    btn.disabled = n === 0;
    saveBar.classList.toggle('dirty', n > 0);
    dirtyText.textContent = n === 0 ? '没有未保存的修改' : `${n} 项未保存的修改`;
    dirtyText.className = n === 0 ? 'small dim' : 'small';
    if (n === 0) clearAllErrors();
  }

  function clearAllErrors() {
    for (const { field } of controls.values()) {
      field.classList.remove('error');
      const e = field.querySelector('.err');
      if (e) { e.style.display = 'none'; e.textContent = ''; }
    }
  }

  function showErrors(errors) {
    clearAllErrors();
    let first = null;
    for (const [path, msg] of Object.entries(errors || {})) {
      const c = controls.get(path);
      if (!c) continue;
      c.field.classList.add('error');
      const e = c.field.querySelector('.err');
      if (e) { e.textContent = msg; e.style.display = ''; }
      if (!first) first = c.field;
    }
    if (first) { first.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    return Object.keys(errors || {}).length;
  }

  async function save() {
    const patch = {};
    for (const [path, value] of Object.entries(dirty)) {
      // JSON 字段解析失败时原样提交，服务端会回报带路径的错误
      patch[path] = value;
    }
    if (!Object.keys(patch).length) return;
    const btn = document.getElementById('btnSave');
    await ui.withBusy(btn, async () => {
      try {
        const d = await ui.api('/api/config', { method: 'POST', body: { patch } });
        CFG = d.config;
        dirty = {};
        clearAllErrors();
        const reconnect = (d.changed || []).some((p) => /^(obs|vmix)\./.test(p));
        const needRestart = (d.changed || []).some((p) => /^server\.(overlayPort|controlPort|host)$/.test(p));
        ui.ok(`已保存 ${d.changed?.length || 0} 项${(d.changed || []).length > 48 ? '' : '：' + (d.changed || []).slice(0, 6).join(', ')}${(d.changed || []).length > 6 ? ' …' : ''}`);
        if (reconnect) ui.warn('连接地址已变更，服务正在用新地址重连（状态条会实时反映结果）');
        if (needRestart) ui.warn('服务端口已变更 —— 需要重启服务进程才会生效');
        syncDirty();
        // 重新渲染以反映服务端归一化后的值（如 "1,2,3" → [1,2,3]）
        render();
        applyHashAnchor();
      } catch (e) {
        if (e.data && e.data.errors) {
          const n = showErrors(e.data.errors);
          ui.err(`有 ${n} 处配置不合法，已在对应字段下方标出`, { title: '保存被拒绝' });
        } else {
          ui.err(e.message, { title: '保存失败' });
        }
      }
    });
  }

  // ══════════════════════════════════════════════════════
  // 导入 / 导出 / 恢复默认
  // ══════════════════════════════════════════════════════
  function exportConfig() {
    const blob = new Blob([JSON.stringify(CFG, null, 2)], { type: 'application/json' });
    const a = el('a', { href: URL.createObjectURL(blob), download: `config-${new Date().toISOString().slice(0, 10)}.json` });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    ui.ok('配置已导出（敏感字段为掩码值，导入后需重新填写密码 / 令牌）');
  }

  function importConfig() {
    const ta = el('textarea', { style: { minHeight: '260px', fontFamily: 'var(--mono)', fontSize: '12px' }, placeholder: '把 config.json 的内容粘贴到这里…' });
    const file = el('input', { type: 'file', accept: '.json,application/json', onchange: async () => {
      const f = file.files?.[0]; if (!f) return;
      ta.value = await f.text();
    } });
    const m = ui.modal({
      title: '导入配置',
      wide: true,
      body: el('div', null,
        el('div', { class: 'note warn', html: '导入会<strong>整体替换</strong>当前配置。掩码值（含 •）会被忽略，导入后需要重新填写 OBS 密码。' }),
        el('div', { class: 'field mt12' }, el('label', { text: '选择文件' }), file),
        el('div', { class: 'field' }, el('label', { text: '或直接粘贴 JSON' }), ta),
      ),
      footer: [
        el('button', { class: 'btn ghost', text: '取消', onclick: () => m.close() }),
        el('button', { class: 'btn primary', text: '导入并覆盖', onclick: async (e) => {
          let parsed;
          try { parsed = JSON.parse(ta.value); } catch (err) { ui.err(`JSON 解析失败：${err.message}`); return; }
          await ui.withBusy(e.target, async () => {
            try {
              await ui.api('/api/config/import', { method: 'POST', body: { config: parsed } });
              m.close(); ui.ok('配置已导入'); load(true); refreshMonitorLink();
            } catch (err) {
              if (err.data?.errors) {
                const list = Object.entries(err.data.errors).map(([k, v]) => `${k}：${v}`).join('\n');
                ui.err('导入被拒绝，配置存在问题', { title: '校验失败' });
                ui.modal({ title: '配置校验错误', width: 700, body: el('pre', { class: 'note danger', style: { whiteSpace: 'pre-wrap' }, text: list }), footer: [el('button', { class: 'btn', text: '关闭', onclick: (ev) => ev.target.closest('.modal-back').remove() })] });
              }
            }
          });
        } }),
      ],
    });
  }

  async function resetConfig() {
    const yes = await ui.confirm({
      title: '恢复默认配置', danger: true, confirmText: '恢复默认',
      message: '这会把 config/config.json 整体重置为出厂默认值（所有地址回到 127.0.0.1）。',
      detail: '当前配置不会自动备份 —— 建议先「导出配置」保存一份。',
    });
    if (!yes) return;
    try {
      await ui.api('/api/config/reset', { method: 'POST' });
      ui.ok('已恢复默认配置');
      load(true);
    } catch (e) { /* api() 已提示 */ }
  }

  // ══════════════════════════════════════════════════════
  // 锚点定位（支持 /settings#replay、/settings#cue 这类深链接）
  // ══════════════════════════════════════════════════════
  function jumpTo(groupId, { flash = true } = {}) {
    const card = cards.get(groupId);
    if (!card) return;
    card.scrollIntoView({ behavior: 'smooth', block: 'start' });
    if (flash) {
      card.classList.remove('section-flash');
      void card.offsetWidth;          // 强制重排以便重播动画
      card.classList.add('section-flash');
      setTimeout(() => card.classList.remove('section-flash'), 2600);
      highlightToc(groupId);
    }
  }

  function highlightToc(groupId) {
    for (const a of document.querySelectorAll('#toc a')) a.classList.remove('on');
    const a = document.querySelector(`#toc a[href="#${groupId}"]`);
    if (a) a.classList.add('on');
  }

  function applyHashAnchor() {
    const id = (location.hash || '').replace(/^#/, '');
    if (!id) return;
    setTimeout(() => jumpTo(id), 120);
  }

  window.addEventListener('hashchange', applyHashAnchor);

  // ══════════════════════════════════════════════════════
  // 工具
  // ══════════════════════════════════════════════════════
  function getPath(obj, path) {
    return String(path).split('.').reduce((o, k) => (o == null ? undefined : o[k]), obj);
  }

  // 离开页面前提醒未保存
  window.addEventListener('beforeunload', (e) => {
    if (Object.keys(dirty).length) { e.preventDefault(); e.returnValue = ''; }
  });

  // Ctrl+S 保存
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); save(); }
  });

  // WS 推来的配置变更（别的页面改的）→ 提示
  window.arcadeWS?.start({});
  window.arcadeWS?.on('patch', (m) => {
    if (m.path === 'config.restartRequired') ui.warn(m.value?.msg || '服务端口已变更，需重启服务');
  });

  // 启动
  load();
})();
</script>
</body>
</html>
