<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>曲目库 · 街机音游赛事控制软件</title>
<link rel="stylesheet" href="/shared/style.css">
<style>
  .music-stats { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .music-stats .spacer { flex: 1; min-width: 20px; }

  .music-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .music-toolbar input[type=search] { flex: 1; min-width: 220px; max-width: 420px; }
  .music-toolbar select { width: auto; min-width: 120px; }

  .music-table-wrap { overflow-x: auto; }
  .music-table { width: 100%; border-collapse: collapse; font-size: 12.5px; min-width: 940px; }
  .music-table th {
    text-align: left; padding: 8px 9px; border-bottom: 1px solid var(--border);
    font-family: var(--mono); font-size: 10.5px; letter-spacing: 1.2px;
    color: var(--text-mute); font-weight: 700; white-space: nowrap;
  }
  .music-table td { padding: 8px 9px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .music-table tr:hover td { background: var(--surface-2); }
  .music-table .id { font-family: var(--mono); color: var(--text-mute); }
  .music-table .cover-thumb { width: 38px; height: 38px; object-fit: cover; border-radius: 3px; border: 1px solid var(--border); background: #111; display: block; }
  .music-table .cover-thumb.ph { display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-size: 14px; }
  .music-table .title { font-weight: 700; color: var(--text); }
  .music-table .artist { font-size: 11px; color: var(--text-mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
  .music-table .lv { font-family: var(--mono); font-weight: 700; text-align: center; white-space: nowrap; }
  .music-table .lv.missing { color: var(--text-dim); font-weight: 400; }
  .music-table .actions { text-align: right; white-space: nowrap; }
  .music-table .actions .btn { min-height: 24px; padding: 1px 7px; font-size: 11px; }
  .music-table .cn { text-align: center; }
  .cn-diff-list { max-height: 54vh; overflow: auto; border: 1px solid var(--border); border-radius: 4px; margin-top: 8px; }
  .cn-diff-row { padding: 7px 10px; border-bottom: 1px solid var(--border); font-size: 12px; }
  .cn-diff-row:last-child { border-bottom: 0; }
  .cn-diff-name { color: var(--text); margin-bottom: 3px; }
  .cn-diff-changes { color: var(--text-mute); font-family: var(--mono); font-size: 11px; line-height: 1.55; }

  .pager { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 12px; }
  .pager .info { font-family: var(--mono); font-size: 11.5px; color: var(--text-mute); }
  .pager .spacer { flex: 1; }
  .pager-jump { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-mute); }
  .pager-jump input {
    width: 54px; min-height: 28px; padding: 2px 6px; text-align: center;
    background: #17181b; color: var(--text); border: 1px solid var(--border-strong);
    border-radius: 3px; font-family: var(--mono); font-size: 12px;
  }
  .pager-jump input:focus { outline: none; border-color: var(--accent); }

  .diff-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; }
  .diff-grid .field { margin: 0; }
  .diff-grid label { font-family: var(--mono); font-size: 10.5px; letter-spacing: .5px; }
  .diff-grid input { text-align: center; }
  .editor-grid { display: grid; gap: 10px; }
  .editor-grid .field { margin: 0; }
  .editor-grid .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .hint { font-size: 11.5px; color: var(--text-dim); line-height: 1.6; }
</style>
  <link rel="preload" href="/fonts/zihui-wenyihei.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="/shared/font.css">
</head>
<body>
<script src="/shared/format.js"></script>
<script src="/shared/ui.js"></script>
<script src="/shared/ws.js"></script>
<script>
'use strict';
(function () {
  const { el, clear, api, ok, err, cmdError, modal, confirm, withBusy, mount } = ui;
  const fmt = window.fmt;

  const page = mount({
    current: '/music',
    title: '曲目库',
    subtitle: '曲目增改删 · 日服 / 国服定数切换 · 游戏目录导入 · 国服公共 API 同步',
  });

  const DIFF_ORDER = ['basic', 'advanced', 'expert', 'master', 'ultima'];
  const levelText = (v) => {
    const n = Number(v);
    if (!Number.isFinite(n)) return '—';
    return Number.isInteger(n) ? String(n) : String(Math.round(n * 100) / 100);
  };
  const S = {
    meta: null,
    items: [],
    total: 0,
    offset: 0,
    limit: 50,
    q: '',
    genre: '',
    difficulty: '',
    cnOnly: false,
    levelSource: 'jp',
    cnPending: null,
  };

  // ── 概览 ────────────────────────────────────────────────
  const totalPill = el('span', { class: 'pill mute', text: '曲目 0' });
  const cnPill = el('span', { class: 'pill mute', text: '国服 0' });
  const genrePill = el('span', { class: 'pill mute', text: '分类 0' });
  const coverPill = el('span', { class: 'pill mute', text: '封面 0' });
  const wePill = el('span', { class: 'pill mute', text: 'WE 0' });
  const timeText = el('span', { class: 'small muted' });
  const importBtn = el('button', { class: 'btn primary sm', text: '⇪ 导入 xlsx' });
  const gameBtn = el('button', { class: 'btn sm', text: '🎮 从游戏导入' });
  const cnSyncBtn = el('button', { class: 'btn sm', text: '☁ 同步国服数据' });
  const addBtn = el('button', { class: 'btn sm', text: '＋ 添加曲目' });
  const reloadBtn = el('button', { class: 'btn ghost sm', text: '⟳ 重新载入' });
  const fileInput = el('input', { type: 'file', accept: '.xlsx,.xls', class: 'hidden' });
  const levelSourceSel = el('select', {
    style: { width: 'auto', minHeight: '30px', padding: '3px 7px', fontSize: '12px' },
    title: '切换曲目库使用的定数来源',
  },
    el('option', { value: 'jp', text: '日服定数（游戏）' }),
    el('option', { value: 'cn', text: '国服定数（API）' }),
  );
  const cnInfo = el('span', { class: 'small muted' });
  const cnBanner = el('div', { class: 'note warn', style: { display: 'none' } });

  page.append(el('section', { class: 'card mb12' },
    el('header', null,
      el('span', { text: '曲目库概览' }),
      el('span', { class: 'spacer' }),
      el('a', { class: 'btn ghost sm', href: '/match', text: '去比赛页' }),
    ),
    el('div', { class: 'body' },
      el('div', { class: 'music-stats' },
        totalPill, cnPill, genrePill, coverPill, wePill, timeText,
        el('span', { class: 'spacer' }),
        el('span', { class: 'small muted', text: '定数来源' }), levelSourceSel,
        importBtn, gameBtn, cnSyncBtn, addBtn, reloadBtn,
      ),
      fileInput,
      el('div', { class: 'inline mt8' }, cnInfo),
      cnBanner,
      el('div', { class: 'hint mt8', text: '比赛页 / 手机选曲页读取的是 data/music.json。上传 xlsx 会全量替换曲目库（旧文件备份为 data/music.json.bak），并同步更新 data/source 里的源文件。游戏导入只合并/更新游戏内曲目，保留国服定数与现有封面失败时的旧封面。' }),
    ),
  ));

  // ── 筛选 + 列表 ─────────────────────────────────────────
  const search = el('input', { type: 'search', placeholder: '搜索曲名 / 曲师 / ID…' });
  const genreSel = el('select', null, el('option', { value: '', text: '全部分类' }));
  const diffSel = el('select', null,
    el('option', { value: '', text: '全部难度' }),
    ...DIFF_ORDER.map((k) => el('option', { value: k, text: k.toUpperCase() })),
    el('option', { value: 'we', text: "WORLD'S END" }),
  );
  const cnChk = el('input', { type: 'checkbox' });
  const countText = el('span', { class: 'small muted' });
  const tbody = el('tbody');
  const pager = el('div', { class: 'pager' });

  let qTimer = null;
  let cnModal = null;
  let lastPromptedId = null;
  search.oninput = () => {
    clearTimeout(qTimer);
    qTimer = setTimeout(() => { S.q = search.value.trim(); S.offset = 0; loadList(); }, 250);
  };
  genreSel.onchange = () => { S.genre = genreSel.value; S.offset = 0; loadList(); };
  diffSel.onchange = () => { S.difficulty = diffSel.value; S.offset = 0; loadList(); };
  cnChk.onchange = () => { S.cnOnly = cnChk.checked; S.offset = 0; loadList(); };
  reloadBtn.onclick = () => reload(true);

  importBtn.onclick = () => fileInput.click();
  fileInput.onchange = () => {
    const file = fileInput.files?.[0];
    fileInput.value = '';
    if (file) importXlsx(file);
  };
  addBtn.onclick = () => openEditor(null);

  levelSourceSel.onchange = async () => {
    const source = levelSourceSel.value;
    levelSourceSel.disabled = true;
    try {
      const r = await api('/api/music/level-source', { method: 'POST', body: { source } });
      S.meta = r.meta;
      renderMeta();
      await loadList();
      ok(`已切换为${source === 'cn' ? '国服' : '日服'}定数`);
    } catch (e) {
      levelSourceSel.value = S.meta?.levelSource || 'jp';
      cmdError(e, '切换定数来源');
    } finally {
      levelSourceSel.disabled = false;
    }
  };

  gameBtn.onclick = () => withBusy(gameBtn, async () => {
    const yes = await confirm({
      title: '从游戏目录导入曲目',
      message: '按本地游戏目录更新曲名、曲师、分类、日服定数与曲绘？国服定数 / 国服标记会保留，游戏内没有的旧曲目也会保留。',
      confirmText: '开始导入',
    });
    if (!yes) return;
    try {
      const r = await api('/api/music/game/import', { method: 'POST', body: {} });
      await reload();
      const s = r.summary || {};
      ok(`游戏导入完成：新增 ${s.added || 0}，更新 ${s.updated || 0}，封面 ${s.covers || 0}，WE ${s.weUpdated || 0}`);
      if (s.errors?.length) err(`有 ${s.errors.length} 条警告：${s.errors.slice(0, 3).join('；')}`);
    } catch (e) { cmdError(e, '从游戏目录导入'); }
  });

  cnSyncBtn.onclick = () => withBusy(cnSyncBtn, async () => {
    try {
      const r = await api('/api/music/cn/sync', { method: 'POST', body: {} });
      if (r.changed && r.pending) {
        S.cnPending = r.pending;
        renderCnPending();
        openCnPending(r.pending);
      } else {
        await reload();
        ok('国服数据已是最新');
      }
    } catch (e) { cmdError(e, '同步国服数据'); }
  });

  cnBanner.onclick = (e) => {
    if (e.target.closest('button')) return;
    if (S.cnPending) openCnPending(S.cnPending);
  };

  const tableCard = el('section', { class: 'card' },
    el('header', null,
      el('span', { text: '曲目列表' }), countText,
      el('span', { class: 'spacer' }),
      el('span', { class: 'sub', text: '难度定数按 0.1 步进；留空表示该难度不存在' }),
    ),
    el('div', { class: 'body' },
      el('div', { class: 'music-toolbar mb12' },
        search, genreSel, diffSel,
        el('label', { class: 'check' }, cnChk, el('span', { class: 'label', text: '仅国服' })),
      ),
      el('div', { class: 'music-table-wrap' },
        el('table', { class: 'music-table' },
          el('thead', null, el('tr', null,
            el('th', { text: '封面' }),
            el('th', { text: 'ID' }),
            el('th', { text: '曲名 / 曲师' }),
            el('th', { text: '分类' }),
            el('th', { text: '国服' }),
            ...DIFF_ORDER.map((k) => el('th', { text: k.toUpperCase(), dataset: { diff: k }, style: { textAlign: 'center' } })),
            el('th', { text: 'WE', dataset: { diff: 'we' }, style: { textAlign: 'center' } }),
            el('th', { text: '操作', style: { textAlign: 'right' } }),
          )),
          tbody,
        ),
      ),
      pager,
    ),
  );

  page.append(tableCard);

  // 难度表头单元格：加载到曲库元数据后按官方难度色上色
  const diffHeaderCells = {};
  tableCard.querySelectorAll('th[data-diff]').forEach((th) => { diffHeaderCells[th.dataset.diff] = th; });

  function applyDiffColors() {
    const d = S.meta?.difficulties || {};
    for (const k of DIFF_ORDER) {
      const th = diffHeaderCells[k];
      if (th) th.style.color = d[k]?.color || '';
    }
    if (diffHeaderCells.we) diffHeaderCells.we.style.color = S.meta?.we?.color || '#c98bff';
  }

  // ── 数据 ────────────────────────────────────────────────
  function fillGenres(meta) {
    const cur = genreSel.value;
    clear(genreSel);
    genreSel.append(el('option', { value: '', text: '全部分类' }));
    for (const g of meta?.genres || []) {
      genreSel.append(el('option', { value: g.name, text: `${g.label || g.name}（${g.count}）` }));
    }
    genreSel.value = cur || '';
    S.genre = genreSel.value;
  }

  function renderMeta() {
    const m = S.meta || {};
    totalPill.textContent = `曲目 ${m.counts?.songs ?? 0}`;
    cnPill.textContent = `国服 ${m.counts?.cn ?? 0}`;
    genrePill.textContent = `分类 ${m.genres?.length ?? 0}`;
    coverPill.textContent = `封面 ${m.counts?.covers ?? 0}`;
    wePill.textContent = `WE ${m.counts?.we ?? 0}`;
    const time = m.updatedAt || m.generatedAt;
    timeText.textContent = time
      ? `${m.updatedAt ? '最后修改' : '导入'} ${fmt.datetime(time)}${m.sourceSheet ? ` · ${m.sourceSheet}` : ''}`
      : '尚未导入曲目';
    totalPill.className = `pill ${m.counts?.songs ? 'ok' : 'mute'}`;
    S.levelSource = m.levelSource || 'jp';
    levelSourceSel.value = S.levelSource;
    const cn = m.cn || {};
    const last = Number(cn.lastSyncAt) || 0;
    cnInfo.textContent = [
      `定数：${S.levelSource === 'cn' ? '国服（API）' : '日服（游戏）'}`,
      `国服数据：${last ? fmt.datetime(new Date(last).toISOString()) : '尚未同步'}`,
      cn.version ? `API v${cn.version}` : '',
      m.counts?.cnLevels ? `已有国服定数 ${m.counts.cnLevels} 首` : '',
      '来源：LXNS 公共 API',
    ].filter(Boolean).join(' · ');
    if (cn.pending) {
      S.cnPending = cn.pending;
      renderCnPending();
      if (cn.pending.id !== lastPromptedId) openCnPending(cn.pending);
    }
    fillGenres(m);
    applyDiffColors();
  }

  function changeSummary(p) {
    const s = p?.summary || {};
    return `新增国服 ${s.cnAdded || 0} · 移除标记 ${s.cnRemoved || 0} · 定数变化 ${s.levelChanged || 0} · WE 变化 ${s.weChanged || 0}`;
  }

  function renderCnPending() {
    const p = S.cnPending;
    if (!p) { cnBanner.style.display = 'none'; return; }
    cnBanner.style.display = '';
    clear(cnBanner);
    cnBanner.append(
      el('div', { class: 'inline' },
        el('span', { text: `国服 API 有 ${p.summary?.entries ?? 0} 项变化待确认：${changeSummary(p)}` }),
        el('span', { class: 'spacer' }),
        el('button', {
          class: 'btn sm', text: '查看并确认',
          onclick: () => openCnPending(p),
        }),
      ),
      el('div', { class: 'small muted mt8', text: `拉取时间 ${fmt.datetime(new Date(p.at).toISOString())} · API v${p.version || '—'}。确认前不会修改曲目库。` }),
    );
  }

  function openCnPending(p) {
    if (!p) return;
    if (cnModal && lastPromptedId === p.id) return;
    if (cnModal) { try { cnModal.close(); } catch { /* ignore */ } }
    lastPromptedId = p.id;
    const entries = p.entries || [];
    const list = el('div', { class: 'cn-diff-list' });
    for (const entry of entries) {
      const bits = [];
      if (entry.cn && entry.cn.from !== entry.cn.to) {
        bits.push(`国服：${entry.cn.from ? '可用' : '不可用'} → ${entry.cn.to ? '可用' : '不可用'}`);
      }
      if (entry.releaseDate && entry.releaseDate.from !== entry.releaseDate.to) {
        bits.push(`配信：${entry.releaseDate.from || '—'} → ${entry.releaseDate.to || '—'}`);
      }
      for (const [k, v] of Object.entries(entry.levels || {})) {
        bits.push(`${k.toUpperCase()} ${v.from ?? '—'} → ${v.to ?? '—'}`);
      }
      if (entry.we) {
        bits.push(`WE：${entry.we.from?.cn ? '可用' : '不可用'}${entry.we.from?.cnStar ? `★${entry.we.from.cnStar}` : ''} → ${entry.we.to?.cn ? '可用' : '不可用'}${entry.we.to?.cnStar ? `★${entry.we.to.cnStar}` : ''}`);
      }
      list.append(el('div', { class: 'cn-diff-row' },
        el('div', { class: 'cn-diff-name' }, el('b', { text: `#${entry.id}` }), ` ${entry.name || ''}`),
        el('div', { class: 'cn-diff-changes', text: bits.join(' · ') || '相关元数据变化' }),
      ));
    }
    const body = el('div', null,
      el('div', { class: 'note warn', text: `待确认 ${p.summary?.entries ?? 0} 项：${changeSummary(p)}。请抽查定数与国服标记是否符合预期，确认后写入 data/music.json。` }),
      el('div', { class: 'small muted mt8 mb8', text: `API v${p.version || '—'} · 国服日期 ${p.today || '—'} · 显示前 ${entries.length} 项${p.truncated ? '（其余已省略）' : ''}` }),
      list,
    );
    let discardBtn;
    const applyBtn = el('button', {
      class: 'btn primary', text: '确认应用',
      onclick: () => withBusy(applyBtn, async () => {
        try {
          const r = await api('/api/music/cn/confirm', { method: 'POST', body: {} });
          m.close();
          S.cnPending = null;
          renderCnPending();
          await reload();
          ok(`已应用 ${r.applied ?? 0} 项国服更新`);
        } catch (ex) { cmdError(ex, '应用国服更新'); }
      }),
    });
    discardBtn = el('button', {
      class: 'btn ghost', text: '放弃本次更新',
      onclick: () => withBusy(discardBtn, async () => {
        try {
          await api('/api/music/cn/discard', { method: 'POST', body: {} });
          m.close();
          S.cnPending = null;
          renderCnPending();
          ok('已放弃本次国服更新');
        } catch (e) { cmdError(e, '放弃更新'); }
      }),
    });
    const m = modal({
      title: '国服数据更新待确认',
      wide: true,
      body,
      onClose: () => { if (cnModal === m) cnModal = null; },
      footer: [discardBtn, applyBtn],
    });
    cnModal = m;
  }

  async function loadMeta() {
    const m = await api('/api/music/meta');
    S.meta = m;
    renderMeta();
  }

  async function loadList() {
    const q = new URLSearchParams({
      q: S.q,
      genre: S.genre,
      difficulty: S.difficulty,
      cnOnly: S.cnOnly ? '1' : '',
      // 曲目库是管理视图：默认把 WE 特殊谱面也列出来，选 WE 时才能筛到
      includeWe: '1',
      limit: String(S.limit),
      offset: String(S.offset),
    });
    const r = await api(`/api/music?${q}`);
    S.items = r.items || [];
    S.total = r.total || 0;
    if (r.meta) { S.meta = r.meta; renderMeta(); }
    renderRows();
  }

  function reload(showToast = false) {
    Promise.all([loadMeta(), loadList()])
      .then(() => { if (showToast) ok('曲目库已重新载入'); })
      .catch((e) => cmdError(e, '读取曲目库'));
  }

  function renderRows() {
    clear(tbody);
    countText.textContent = S.total ? `共 ${S.total} 首` : '';
    if (!S.items.length) {
      tbody.append(el('tr', null, el('td', { colspan: '12' },
        el('div', { class: 'dim small', style: { padding: '22px 6px' },
          text: S.q || S.genre || S.difficulty || S.cnOnly
            ? '没有匹配的曲目'
            : '曲目库是空的：点右上角「导入 xlsx」或「添加曲目」。' }))));
      renderPager();
      return;
    }

    for (const song of S.items) {
      const tr = el('tr', null,
        el('td', null,
          song.cover
            ? el('img', { class: 'cover-thumb', src: song.cover, alt: '', loading: 'lazy' })
            : el('span', { class: 'cover-thumb ph', text: '♪' }),
        ),
        el('td', { class: 'id', text: String(song.id) }),
        el('td', null,
          el('div', { class: 'title', text: song.name }),
          el('div', { class: 'artist', text: song.artist || '—' }),
        ),
        el('td', { text: song.genreLabel || song.genre || '—' }),
        el('td', { class: 'cn' },
          el('span', { class: `pill ${song.cn ? 'ok' : 'mute'}`, text: song.cn ? '国服' : '日服' })),
        ...DIFF_ORDER.map((k) => {
          const lv = song.difficulties?.[k];
          const color = S.meta?.difficulties?.[k]?.color;
          return el('td', {
            class: `lv${lv ? '' : ' missing'}`,
            text: lv ? levelText(lv) : '—',
            style: lv && color ? { color, fontWeight: '800' } : null,
          });
        }),
        el('td', { class: `lv${song.we ? '' : ' missing'}`, style: { color: song.we ? '#c98bff' : '' }, text: song.we ? `${song.we.kanji}★${song.we.star}` : '—' }),
        el('td', { class: 'actions' },
          el('button', { class: 'btn ghost', text: '编辑', onclick: () => openEditor(song) }),
          el('button', { class: 'btn ghost', text: '删除', onclick: () => removeSong(song) }),
        ),
      );
      tbody.append(tr);
    }
    renderPager();
  }

  function renderPager() {
    clear(pager);
    const pages = Math.max(1, Math.ceil(S.total / S.limit));
    const cur = Math.floor(S.offset / S.limit) + 1;
    const pageIn = el('input', {
      type: 'number', min: '1', max: String(pages), step: '1', value: String(cur),
      title: '输入页码后按回车跳转', 'aria-label': '跳转页码',
    });
    const goPage = () => {
      const raw = Math.round(Number(pageIn.value));
      if (!Number.isFinite(raw)) { pageIn.value = String(cur); return; }
      const page = Math.max(1, Math.min(pages, raw));
      pageIn.value = String(page);
      if (page === cur) return;
      S.offset = (page - 1) * S.limit;
      loadList();
    };
    pageIn.onchange = goPage;
    pageIn.onkeydown = (e) => {
      if (e.key === 'Enter') { e.preventDefault(); goPage(); }
      if (e.key === 'Escape') { pageIn.value = String(cur); pageIn.blur(); }
    };
    pager.append(
      el('span', { class: 'info', text: `显示 ${S.total ? S.offset + 1 : 0}–${Math.min(S.offset + S.items.length, S.total)} / ${S.total}` }),
      el('span', { class: 'spacer' }),
      el('button', {
        class: 'btn ghost sm', text: '‹ 上一页', disabled: cur <= 1,
        onclick: () => { if (cur > 1) { S.offset = Math.max(0, S.offset - S.limit); loadList(); } },
      }),
      el('span', { class: 'info', text: `${cur} / ${pages}` }),
      el('button', {
        class: 'btn ghost sm', text: '下一页 ›', disabled: cur >= pages,
        onclick: () => { if (cur < pages) { S.offset += S.limit; loadList(); } },
      }),
      el('label', { class: 'pager-jump' }, '跳至', pageIn, `/ ${pages} 页`),
    );
  }

  // ── 编辑 / 新增 ─────────────────────────────────────────
  function field(label, input) {
    return el('div', { class: 'field' }, el('label', { text: label }), input);
  }

  function openEditor(song) {
    const isEdit = !!song;
    const source = S.meta?.levelSource || 'jp';
    const sourceLabel = source === 'cn' ? '国服' : '日服';
    const idIn = el('input', {
      type: 'number', min: 1, step: 1,
      value: song?.id ?? '',
      placeholder: isEdit ? '' : '留空自动分配',
      disabled: isEdit,
    });
    const nameIn = el('input', { type: 'text', maxLength: 120, value: song?.name || '', placeholder: '曲名（必填）' });
    const artistIn = el('input', { type: 'text', maxLength: 120, value: song?.artist || '', placeholder: '曲师' });
    const genreIn = el('input', { type: 'text', maxLength: 40, value: song?.genre || '', placeholder: '分类，例如 ORIGINAL', list: 'genre-list' });
    const coverIn = el('input', { type: 'text', maxLength: 500, value: song?.cover || '', placeholder: '/covers/123.webp（留空则没有封面）' });
    const weKanjiVal = source === 'cn'
      ? (song?.we?.cnKanji || song?.we?.kanji || '')
      : (song?.we?.jpKanji || song?.we?.kanji || '');
    const weStarVal = source === 'cn'
      ? (song?.we?.cnStar ?? song?.we?.star ?? '')
      : (song?.we?.jpStar ?? song?.we?.star ?? '');
    const weKanjiIn = el('input', { type: 'text', maxLength: 8, value: weKanjiVal, placeholder: 'WE 汉字，如 止（留空=无）' });
    const weStarIn = el('input', { type: 'number', min: 1, max: 10, step: 1, value: weStarVal, placeholder: '1–10' });
    const coverPreview = el('img', { src: song?.cover || '', alt: '', style: { width: '64px', height: '64px', objectFit: 'cover', borderRadius: '4px', border: '1px solid var(--border)', background: '#111', display: song?.cover ? 'block' : 'none' } });
    coverIn.oninput = () => {
      const src = coverIn.value.trim();
      if (src) { coverPreview.src = src; coverPreview.style.display = 'block'; }
      else { coverPreview.removeAttribute('src'); coverPreview.style.display = 'none'; }
    };
    const cnIn = el('input', { type: 'checkbox', checked: song ? song.cn !== false : true });
    const diffIns = {};
    for (const k of DIFF_ORDER) {
      diffIns[k] = el('input', {
        type: 'number', min: 0, max: 20, step: 0.1,
        value: song?.levels?.[source]?.[k] ?? song?.difficulties?.[k] ?? '',
        placeholder: '—',
      });
    }
    const otherSource = source === 'cn' ? 'jp' : 'cn';
    const otherText = DIFF_ORDER
      .filter((k) => song?.levels?.[otherSource]?.[k])
      .map((k) => `${k.toUpperCase()} ${levelText(song.levels[otherSource][k])}`)
      .join(' · ');

    const datalist = el('datalist', { id: 'genre-list' });
    for (const g of S.meta?.genres || []) datalist.append(el('option', { value: g.name }));

    const m = modal({
      title: isEdit ? `编辑曲目 #${song.id}` : '添加曲目',
      wide: true,
      body: el('div', { class: 'editor-grid' },
        el('div', { class: 'row2' },
          field('ID', idIn),
          field('曲名', nameIn),
        ),
        el('div', { class: 'row2' },
          field('曲师', artistIn),
          field('分类', genreIn),
        ),
        el('div', { class: 'row2' },
          field('封面地址', coverIn),
          el('div', { class: 'field' }, el('label', { text: '封面预览' }), coverPreview),
        ),
        el('div', { class: 'row2' },
          field('WE 汉字', weKanjiIn),
          field('WE 星数', weStarIn),
        ),
        el('label', { class: 'check' }, cnIn, el('span', { class: 'label', text: '国服可用' })),
        el('div', null,
          el('div', { class: 'small muted mb8', text: `难度定数（${sourceLabel}）` }),
          el('div', { class: 'diff-grid' },
            ...DIFF_ORDER.map((k) => field(k.toUpperCase(), diffIns[k])),
          ),
          otherText ? el('div', { class: 'tiny muted mt8', text: `另一侧定数（${otherSource === 'cn' ? '国服' : '日服'}）：${otherText}` }) : null,
        ),
        datalist,
        el('div', { class: 'hint', text: `当前保存到「${sourceLabel}」定数。定数支持 0.1 步进（例如 13.7）；留空的难度不会出现在选曲 / 比赛页。` }),
      ),
      footer: [
        el('button', { class: 'btn ghost', text: '取消', onclick: () => m.close() }),
        el('button', {
          class: 'btn primary', text: isEdit ? '保存修改' : '添加曲目',
          onclick: (e) => withBusy(e.target, async () => {
            const difficulties = {};
            for (const k of DIFF_ORDER) {
              const v = Number(diffIns[k].value);
              if (Number.isFinite(v) && v > 0) difficulties[k] = Math.round(v * 100) / 100;
            }
            const weRaw = { ...(song?.we || {}) };
            if (source === 'cn') {
              weRaw.cnKanji = weKanjiIn.value.trim();
              weRaw.cnStar = weStarIn.value === '' ? null : Number(weStarIn.value);
              if (!weRaw.jpKanji) weRaw.jpKanji = weKanjiIn.value.trim();
              if (!weRaw.jpStar) weRaw.jpStar = weStarIn.value === '' ? null : Number(weStarIn.value);
              if (!weRaw.kanji) weRaw.kanji = weKanjiIn.value.trim();
              if (!weRaw.star) weRaw.star = weStarIn.value === '' ? null : Number(weStarIn.value);
            } else {
              weRaw.kanji = weKanjiIn.value.trim();
              weRaw.star = weStarIn.value === '' ? null : Number(weStarIn.value);
              weRaw.jpKanji = weKanjiIn.value.trim();
              weRaw.jpStar = weStarIn.value === '' ? null : Number(weStarIn.value);
            }
            const body = {
              name: nameIn.value,
              artist: artistIn.value,
              genre: genreIn.value,
              cn: cnIn.checked,
              cover: coverIn.value,
              levelSource: source,
              we: weKanjiIn.value.trim() && weStarIn.value !== '' ? weRaw : null,
              difficulties,
            };
            if (!isEdit && String(idIn.value).trim() !== '') body.id = Number(idIn.value);
            try {
              const r = isEdit
                ? await api(`/api/music/songs/${encodeURIComponent(song.id)}`, { method: 'PUT', body })
                : await api('/api/music/songs', { method: 'POST', body });
              m.close();
              ok(isEdit ? `已更新：${body.name.trim()}` : `已添加：${body.name.trim()}${r.song ? ` · #${r.song.id}` : ''}`);
              await reload();
            } catch (ex) { cmdError(ex, isEdit ? '保存曲目' : '添加曲目'); }
          }),
        }),
      ],
    });
    setTimeout(() => nameIn.focus(), 40);
  }

  async function removeSong(song) {
    const yes = await confirm({
      title: '删除曲目',
      message: `从曲目库删除「${song.name}」？比赛页 / 选曲页将不再显示这首。xlsx 源文件不会被修改。`,
      danger: true, confirmText: '删除',
    });
    if (!yes) return;
    try {
      await api(`/api/music/songs/${encodeURIComponent(song.id)}`, { method: 'DELETE', body: {} });
      ok(`已删除：${song.name}`);
      if (S.items.length === 1 && S.offset > 0) S.offset = Math.max(0, S.offset - S.limit);
      await reload();
    } catch (ex) { cmdError(ex, '删除曲目'); }
  }

  // ── xlsx 导入 ───────────────────────────────────────────
  async function importXlsx(file) {
    const yes = await confirm({
      title: '导入 xlsx',
      message: `用「${file.name}」全量替换当前曲目库？现有 data/music.json 会先备份为 .bak。`,
      danger: true, confirmText: '导入并替换',
    });
    if (!yes) return;
    const fd = new FormData();
    fd.append('file', file);
    try {
      const { res, data } = await ui.uploadFetch('/api/music/import', fd);
      if (!res.ok || data.ok === false) {
        throw new Error(data.errors?.file || data.nack?.msg || `导入失败（HTTP ${res.status}）`);
      }
      S.offset = 0;
      await reload();
      ok(`导入完成：${data.counts?.songs ?? 0} 首（国服 ${data.counts?.cn ?? 0}）`);
      if (data.sourceWarning) err(data.sourceWarning);
    } catch (e) {
      err(e.message);
    }
  }

  if (window.arcadeWS) {
    arcadeWS.watch('music.cnSync', (v) => {
      S.cnPending = v || null;
      renderCnPending();
      if (v && v.id !== lastPromptedId) openCnPending(v);
      if (!v) {
        lastPromptedId = null;
        if (cnModal) { try { cnModal.close(); } catch { /* ignore */ } }
      }
    });
  }

  reload();
})();
</script>
</body>
